[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short

# Explicit rather than "auto": this package's async tests are all marked,
# and auto mode would silently swallow a missing marker on a coroutine
# test, making it look like it passed when it never ran.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
