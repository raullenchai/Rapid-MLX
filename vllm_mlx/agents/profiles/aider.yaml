name: aider
display_name: "Aider"
repo: "Aider-AI/aider"
stars: 43000

config:
  type: env
  env_vars:
    OPENAI_API_BASE: "{base_url}"
    # Rendered from RAPID_MLX_API_KEY when set, else "not-needed". The desktop
    # app mints a per-launch bearer, so a hardcoded "not-needed" here failed
    # with AuthenticationError for every desktop user.
    OPENAI_API_KEY: "{api_key}"

models:
  recommended:
    - "qwen3.5-9b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.5-4b-4bit"
    - "deepseek-r1-8b-4bit"

streaming:
  extra_tool_tags: []
  max_tools: 0  # Aider does NOT use function calling

testing:
  # pip/uv installs expose the regular `aider` console script on PATH.
  # Keeping this null made `agents aider --test` report PASS without ever
  # launching Aider itself.
  binary: aider
  query_cmd: "aider --message '{query}' --yes --no-git"
  query_timeout: 180
  install_cmd: "pip install aider-chat"

capabilities:
  function_calling: false  # uses text edit formats, not FC
  streaming: true

known_issues:
  - "Model names need LiteLLM's openai/ prefix (aider --model openai/<alias>) or routing fails before the request is sent"
  - "A macOS system HTTP proxy breaks this: aider's httpx honours it but ignores the OS exceptions list, so 127.0.0.1 is proxied and returns an empty 502. Export NO_PROXY=127.0.0.1,localhost"
  - "Does NOT use function calling — uses text edit formats (unified diff, search/replace)"
  - "Best local model support of any agent — works with virtually any model"
  - "Architect mode: dual model (one plans, one edits) — use --architect flag"
  - "Voice-to-code via Whisper"
