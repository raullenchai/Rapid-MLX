name: opencode
display_name: "OpenCode"
repo: "sst/opencode"
stars: 16000

# OpenCode (opencode.ai) is a Claude-Code-like terminal coding agent.
# It speaks the OpenAI-compatible chat completions API via the
# ``@ai-sdk/openai-compatible`` provider; we point that at rapid-mlx.
#
# Config lives at ~/.config/opencode/opencode.json (or ./opencode.json in
# a project root). The ``$schema`` URL is canonical from opencode.ai.
config:
  type: json
  path: "~/.config/opencode/opencode.json"
  template: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "rapid-mlx": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Rapid-MLX",
          "options": {
            "baseURL": "{base_url}",
            "apiKey": "{api_key}"
          },
          "models": {
            "{model_id}": {}
          }
        }
      },
      "model": "rapid-mlx/{model_id}"
    }

models:
  recommended:
    - "qwen3-coder-30b-4bit"
    - "qwen3.5-9b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.5-4b-4bit"

streaming:
  extra_tool_tags: []
  max_tools: 25  # mirrors Claude Code tool count

testing:
  binary: opencode
  # `opencode run <message>` is a headless single-shot mode (verified on
  # 1.18.18). The profile used to claim OpenCode was interactive-only,
  # which made --test skip the one check that would have caught the
  # hardcoded apiKey.
  query_cmd: "opencode run '{query}'"
  query_timeout: 120
  install_cmd: "brew install sst/tap/opencode  # or: npm install -g opencode-ai"

capabilities:
  function_calling: true
  streaming: true

known_issues:
  - "The written config carries the bearer in cleartext at 0644, and the desktop app rotates that bearer every launch — re-run the setup after restarting Rapid or the saved key stops working."
  - "A macOS system HTTP proxy breaks this: 127.0.0.1 gets proxied despite the OS exceptions list, surfacing as a connection error. Export NO_PROXY=127.0.0.1,localhost"
  - "Config schema may need updating across OpenCode versions — if this template doesn't load, run `opencode --help` and check `~/.config/opencode/opencode.json` against the docs at opencode.ai."
  - "First run of OpenCode may prompt for an Anthropic API key — choose 'skip' since rapid-mlx is providing the model via the openai-compat provider."
