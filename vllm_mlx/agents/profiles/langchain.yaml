name: langchain
display_name: "LangChain"
kind: framework
repo: "langchain-ai/langchain"
stars: 100000

config:
  type: env
  env_vars:
    OPENAI_BASE_URL: "{base_url}"
    # Rendered from RAPID_MLX_API_KEY when set, else "not-needed". The desktop
    # app mints a per-launch bearer, so a hardcoded "not-needed" here made the
    # printed guide 401 for every desktop user.
    OPENAI_API_KEY: "{api_key}"

models:
  recommended:
    - "qwen3.5-9b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.5-4b-4bit"

streaming:
  max_tools: 10

testing:
  install_cmd: "pip install langchain-openai"
  specific_tests: "test_langchain.py"

capabilities:
  function_calling: true
  streaming: true

known_issues:
  - "with_structured_output() overrides max_tokens to None; thinking models burn budget"
