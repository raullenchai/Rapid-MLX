merge_queue:
  # Serial mode still defaults to five speculative checks. Each Rapid-MLX
  # candidate fans out across the Python, Apple-Silicon, L1, Desktop, and GUI
  # lanes, so concurrent candidates can exhaust both hosted and Manzanita
  # capacity before the first candidate finishes. Keep one integration
  # candidate in flight; jobs within that candidate remain parallel.
  mode: serial
  max_parallel_checks: 1
  skip_intermediate_results: false
  status_comments: outcomes

merge_protections_settings:
  auto_merge_conditions:
    - or:
        - label = merge-ready
        - label = merge-ready-mac

# ``auto_merge_conditions`` admits a ready head initially. After a failed
# candidate, Mergify keeps the head in a terminal dequeued state; its supported
# ``@mergifyio queue <queue-name>`` command resets that state and then enforces
# the same exact-head queue conditions below. Ordinary pull-request rules do
# not reset terminal queue state and must not be used as a requeue substitute.

queue_rules:
  - name: no-mac-batch
    queue_branch_prefix: mergify/merge-queue/
    batch_size: 1
    checks_timeout: auto
    max_checks_retries: 0
    merge_method: squash
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - -draft
      - -from-fork
      - label = merge-ready
      - -label = merge-ready-mac
      - -label = version-bump
      - -label = skip-version-bump
      - "-title ~= ^chore: bump version to "
      - check-success = merge-ready-head
      - check-success = @github-actions/merge-lane-no-mac
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard
    merge_conditions:
      - check-success = @github-actions/candidate-admission/ci
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard

  - name: mac-batch
    queue_branch_prefix: mergify/merge-queue/
    batch_size: 1
    checks_timeout: auto
    max_checks_retries: 0
    merge_method: squash
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - -draft
      - -from-fork
      - label = merge-ready-mac
      - -label = merge-ready
      - -label = version-bump
      - -label = skip-version-bump
      - "-title ~= ^chore: bump version to "
      - check-success = merge-ready-head
      - check-success = @github-actions/merge-lane-mac
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard
    merge_conditions:
      - check-success = @github-actions/candidate-admission/ci
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard
