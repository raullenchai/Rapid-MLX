# SPDX-License-Identifier: Apache-2.0
# Ten representative historical Desktop reports and their verification route.
#
# Each entry is a real user-reported Desktop issue. The expectation records
# what `scripts/dev_verify.py --area "<area>"` must yield for it: either
# candidate journeys from the area mapping, or an explicit uncovered marker
# when no automated journey can demonstrate the reported behavior. This is the
# triage contract between issue intake and the local verification command;
# when an area mapping changes, this file is where the drift shows first.

- issue: 2329
  title: >-
    Desktop onboarding cannot load cached Qwen3.5 2B checkpoint through
    automatic lane resolution
  area: First-run setup wizard
  expected_journeys: [fresh-install, cached-quickstart]

- issue: 2330
  title: >-
    Desktop Chat has no authoritative current-date context
  area: Chat window (asking, answering, tools, formatting)
  expected_journeys: [chat-restore, chat-multimodal-attachments]
  note: >-
    candidates only — no journey asserts date-context prompt content; the
    report maps to the chat area, not to a proven cause

