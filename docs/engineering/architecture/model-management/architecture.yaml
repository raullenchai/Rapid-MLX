  - [artifact, capabilities, derives]
  - [artifact, runtime_compatibility, constrains]
  - [artifact, variant_qualification, qualifies]
  - [model_variant, alias_metadata, presents_as]
  - [machine_fingerprint, machine_class, normalizes]
  - [benchmark_submission, validated_benchmark_run, validates]
  - [validated_benchmark_run, benchmark_aggregate, aggregates]
  - [benchmark_aggregate, profile_candidate, proposes]
  - [profile_candidate, performance_profile, promotes]
  - [machine_class, recommendation_policy, scopes]
  - [variant_qualification, recommendation_policy, gates]
  - [recommendation_policy, ranked_recommendation_set, ranks]
  - [ranked_recommendation_set, selection, supplies]
  - [model_selection_override, selection, overrides]
  - [selection, selected_model_variant, selects]
  - [selected_model_variant, runtime_resolver, resolves]
  - [runtime_config_override, runtime_resolver, overrides]
  - [performance_profile, runtime_resolver, tunes]
  - [machine_class, runtime_resolver, scopes]
  - [workload_profile, runtime_resolver, scopes]
  - [runtime_compatibility, runtime_resolver, constrains]
  - [runtime_resolver, effective_runtime_config, resolves]
  - [effective_runtime_config, desktop_gui, consumed_by]
  - [effective_runtime_config, rapid_server, consumed_by]
  - [desktop_gui, actual_runtime_telemetry, observes]
  - [rapid_server, actual_runtime_telemetry, observes]
  - [actual_runtime_telemetry, feedback_gateway, filters]
  - [feedback_gateway, benchmark_submission, validates_into]
phases:
  0:
    name: Preserve measured baseline
    exit: Existing verified defaults and explicit-user override precedence remain regression-tested.
  1:
    name: Make runtime decisions observable
    exit: CLI, Server, and Desktop receive identical resolved config with field provenance.
  2:
    name: Separate model facts from scoped performance
    exit: One compatible vertical slice varies safely by machine and workload.
  3:
    name: Evidence promotion and quality qualification
    exit: Every new automatic default is an auditable, reversible promotion.
  4:
    name: Product recommendation and community learning
    exit: Community evidence improves recommendations without bypassing validation or qualification.
