:12px;letter-spacing:.2px}.caption strong{color:#403d35;font-size:13px}.pill{border-radius:20px;padding:5px 9px;background:#ecefe8;color:#56725f;font-size:11px}.article{max-width:740px;width:100%;margin:0 auto;padding:38px 26px 24px;font-size:16px;line-height:1.8}.user{margin-left:auto;max-width:86%;background:#eeece5;border-radius:17px 17px 4px 17px;padding:14px 19px;font-size:14px;line-height:1.7;margin-bottom:32px}.assistant-title{font-size:12px;color:#888276;display:flex;align-items:center;gap:8px;margin-bottom:12px}.article h3{font-size:16px;margin:20px 0 5px;font-weight:600}.article p{margin:0 0 10px}.response-actions{display:flex;gap:20px;color:#989183;margin-top:18px;font-size:13px}.notice{max-width:764px;margin:0 auto 12px;background:#f3f0e8;border:1px solid #e7e1d6;border-radius:11px;padding:13px 16px;display:flex;align-items:center;gap:11px;font-size:13px;line-height:1.6}.notice strong{font-weight:600}.notice small{display:block;color:#80786b;font-size:12px}.btn{border:0;border-radius:9px;padding:12px 20px;background:#302e29;color:white;font-size:14px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.secondary{background:#fffefa;border:1px solid #dcd7cb;color:#4f4b41}.btn.quiet{background:transparent;color:#7e776b;border:0;padding:9px}.setup{max-width:770px;width:100%;margin:auto;padding:25px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:10px;color:#a17b3e;font-weight:650;margin-bottom:17px}.setup h1{font-size:38px;letter-spacing:-1.4px;line-height:1.2;font-weight:570;margin:0 0 17px}.setup>p{font-size:16px;color:#827b6f;line-height:1.7;margin-bottom:30px}.model-card{padding:24px;background:#fffefa;border:1px solid #d8c4a0;border-radius:14px;position:relative;box-shadow:0 4px 20px #41301604}.model-card .recommended{font-size:10px;letter-spacing:1px;color:#9e7026;font-weight:600;margin-bottom:18px}.model-card h2{margin:0 0 9px;font-size:21px;letter-spacing:-.5px;font-weight:600}.model-card p{color:#7a7468;font-size:14px;line-height:1.6;margin:0 0 18px}.specs{display:flex;gap:20px;font-size:12px;color:#81796c}.check{position:absolute;right:24px;top:51px;width:22px;height:22px;border:1px solid #b1843e;border-radius:50%;color:#ad792b;display:flex;justify-content:center;align-items:center}.setup-footer{display:flex;align-items:center;justify-content:space-between;margin-top:26px}.alternatives{margin-top:19px;font-size:13px;color:#777063;display:flex;align-items:center;justify-content:space-between;padding:15px 0}.setup-rail{padding-top:15px;display:flex;gap:14px;align-items:center;font-size:13px;color:#a29b90;margin:9px 10px;line-height:1.6}.setup-rail b{width:22px;height:22px;border-radius:50%;border:1px solid #d9d4c9;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:500}.setup-rail.current{color:#3f3a30}.setup-rail.current b{background:#e9deca;border-color:#e9deca}.privacy-row{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid #e7e3d9;font-size:14px;line-height:1.6}.privacy-row .icon{font-size:18px;color:#81745e;width:22px;flex-shrink:0}.privacy-row strong{font-weight:570}.privacy-row p{margin:4px 0 0;font-size:13px;color:#82796b}.toggle{margin-left:auto;margin-top:2px;background:#d8d4ca;border-radius:15px;width:32px;height:20px;flex-shrink:0;padding:3px}.toggle:after{content:"";width:14px;height:14px;display:block;border-radius:50%;background:white}.popover{position:absolute;bottom:8px;left:185px;background:#fffefa;border:1px solid #ded8ca;border-radius:14px;box-shadow:0 14px 40px #302a1b1c;padding:19px;width:310px}.popover h4{margin:0 0 14px;font-size:13px}.mode-row{padding:12px 10px;margin-bottom:6px;border-radius:8px;font-size:13px}.mode-row.sel{background:#efede5}.mode-row small{display:block;color:#8b8172;font-size:11px;line-height:1.6;margin-top:3px}.progress{height:4px;border-radius:2px;background:#ddd7ca;margin-top:9px;overflow:hidden}.progress:before{content:"";display:block;width:38%;height:100%;background:# <div class="artboard"><div class="window" id="window"></div><div class="caption"><strong id="caption"></strong><span>DESIGN PROPOSAL · RAPID DESKTOP · 18 OCT 2026 · not a release screenshot</span></div></div>
<script>
const screen=new URLSearchParams(location.search).get('screen')||'empty';
const navigation=`<div class="traffic"><i></i><i></i><i></i></div><div class="brand"><span class="mark">R</span>Rapid</div><div class="nav active"><span class="symbol">↗</span>New chat<span style="margin-left:auto;font-size:11px;color:#999183">⌘ N</span></div><div class="nav"><span class="symbol">⌕</span>Search chats</div><div class="group">Your conversations</div><div class="history sel">A more thoughtful follow-up</div><div class="history">Notes from Monday</div><div class="history">A weekend in the mountains</div><div class="rail-bottom"><div class="nav"><span class="symbol">▦</span>More tools<span style="margin-left:auto">⌃</span></div><div class="nav"><span class="symbol">⚙</span>Settings</div></div>`;
const setupNav=`<div class="traffic"><i></i><i></i><i></i></div><div class="brand"><span class="mark">R</span>Rapid</div><div class="group">Make yourself at home</div><div class="setup-rail current"><b>1</b>Your local assistant</div><div class="setup-rail"><b>2</b>Prepare this Mac</div><div class="setup-rail"><b>3</b>Your first conversation</div><div class="rail-bottom"><div class="nav"><span class="symbol">◈</span>Runs on your Mac</div><div style="font-size:11px;color:#9a9182;padding:0 13px 10px">No account. No subscription.</div></div>`;
const header=(label='New conversation',status='On this Mac')=>`<div class="topbar"><div class="title">${label}</div><div class="state"><span class="dot"></span>${status}<span style="margin:0 12px;color:#d7d0c3">|</span>Qwen 3.5 <span class="chev">⌄</span><span style="margin-left:18px">···</span></div></div>`;
const composer=(draft='',action='',mode='Chat only')=>`<div class="composer-area"><div class="composer"><div class="${draft?'draft':'placeholder'}">${draft||'Message Rapid…'}</div><div class="composer-actions"><div class="tools"><span class="plus">+</span><span class="mode">${mode==='Chat only'?'◌':'◈'} ${mode} <span class="chev">⌄</span></span></div>${action?`<button class="btn" style="padding:9px 14px;font-size:12px">${action}</button>`:'<span class="send">↑</span>'}</div></div><div class="footnote">${mode==='Chat only'?'Answered locally. AI can make mistakes.':'External tools may send selected information outside this Mac.'}</div></div>`;
const empty=()=>`<div class="welcome"><div class="small-logo">✳</div><h1>What would you like to work on?</h1><p>A little help thinking, writing, and making sense of things.<br>Right here on your Mac.</p><div class="suggestions"><div class="suggestion"><strong>Find the right words <span style="float:right">↗</span></strong><span>Make a message clearer or more thoughtful</span></div><div class="suggestion"><strong>Make sense of a document <span style="float:right">↗</span></strong><span>Attach a text PDF, CSV, or TXT to get started</span></div><div class="suggestion"><strong>Think something through <span style="float:right">↗</span></strong><span>Explore an idea, a decision, or a tricky question</span></div><div class="suggestion"><strong>Learn something new <span style="float:right">↗</span></strong><span>Get a clear explanation, at your own pace</span></div></div></div>`;
const rewrite=`<div class="article"><div class="user">Make this message friendlier and more professional:<br>“Where is the report? Can you send it today?”<br>Give me three options.</div><div class="assistant-title"><span class="mark" style="width:21px;height:21px;font-size:12px;border-radius:6px">R</span>Rapid</div><p>Here are three options, depending on the tone you want:</p><h3>Friendly</h3><p>Hi! Just checking in on the report. Would you be able to send it over today? Thanks!</p><h3>Professional</h3><p>Hi, could you share an update on the report? If possible, I'd appreciate receiving it today. Thank you.</p><h3>With a little context</h3><p>Hi! I'm planning the next steps and wanted to check on the report. Would sending it today work for you? Let me know if you need more time.</p><div class="response-actions"><span>⧉ Copy</span><span>↻ Try again</span><span>···</span></div></div>`;
let title='',body='',rail=(screen==='tools'||screen==='shell'||screen==='answer')?navigation.replace('nav active','nav'):navigation.replace('history sel','history'),topContent=header(),after='';
if(screen==='empty'){title='01 / First value — useful starting points, one obvious place to type';body=empty();after=composer()}
if(screen==='answer'){title='07 / Draft the email — act on the request, keep context out of the answer';rail=rail.replace('A more thoughtful follow-up','A repair request');topContent=header('A repair request');body=`<div class="article"><div class="user">Help me write a short, polite email to my landlord about a leaking kitchen faucet. Ask if someone can repair it this week.</div><div class="assistant-title"><span class="mark" style="width:21px;height:21px;font-size:12px;border-radius:6px">R</span>Rapid</div><p>Here's a draft you can use:</p><h3>Subject: Kitchen faucet repair request</h3><p>Hi [Landlord's name],</p><p>I wanted to let you know that the kitchen faucet in my apartment is leaking. Would it be possible to arrange a repair sometime this week?</p><p>Please let me know what day and time would work best. I'm happy to coordinate access.</p><p>Thank you for your help,<br>[Your name]</p><div class="response-actions"><span>⧉ Copy draft</span><span>↻ Try again</span><span>···</span></div></div>`;after=composer()}
if(screen==='tools'){title='02 / Chat by default — tools are a visible, deliberate choice';topContent=header('A more thoughtful follow-up');body=rewrite;after=composer();body+=`<div class="popover"><h4>How should Rapid help?</h4><div class="mode-row sel">◌ &nbsp; Chat only <span style="float:right">✓</span><small>Write, think, and answer here.<br>No browsing or changes to your files.</small></div><div class="mode-row">◈ &nbsp; Use tools<small>Search the web or work with local files.<br>Review permissions before any action.</small></div><div style="font-size:11px;color:#9b9283;padding:9px 10px 0;border-top:1px solid #e9e4d9">Applies to this conversation.</div></div>`}
if(screen==='sleeping'){title='03 / Readiness — a single action prepares the model and sends the draft';topContent=header('New conversation','Resting · memory released');body=`<div class="welcome" style="width:640px"><div class="small-logo">☾</div><h1>Ready when you are.</h1><p>Your assistant is resting to leave memory for other apps.<br>Send your message and Rapid will wake it up.</p></div>`;after=`<div class="queue"><div class="notice" style="margin-bottom:0"><span style="font-size:18px;color:#9c8357">☾</span><div><strong>Qwen 3.5 is resting</strong><small>Already downloaded. Starting can take a few seconds.</small></div></div></div>`+composer('What is 2 + 2? Reply with only the number.','Start & send');}
if(screen==='shell'){title='04 / Visual hierarchy — conversation first, diagnostics on demand';topContent=header('A more thoughtful follow-up');body=`<div class="split"><div style="flex:1;display:flex;flex-direction:column;min-width:0">${rewrite}<div style="margin-top:auto">${composer()}</div></div><aside class="details"><div class="eyebrow">This session</div><h3>Model & diagnostics <span style="float:right;color:#a19786">×</span></h3><div class="detail-row"><span>Model</span><b>Qwen 3.5 · 4B</b></div><div class="detail-row"><span>Status</span><b>Ready on this Mac</b></div><div class="detail-row"><span>Model memory</span><b>5.9 GB</b></div><div class="detail-row"><span>App version</span><b>0.16.3</b></div><div class="detail-row"><span>Generation speed</span><b>130 tokens / sec</b></div><p>Diagnostics describe the current local session. Share logs when reporting a problem.</p><button class="btn secondary" style="width:100%;font-size:12px;margin-top:20px">View logs</button><button class="btn quiet" style="width:100%;font-size:12px;margin-top:8px">Release model memory…</button></aside></div>`}
if(screen==='setup'){title='05 / First setup — one recommended path, advanced choices one level deeper';rail=setupNav;topContent=`<div class="topbar"><span style="color:#948b7b;font-size:12px">Set up Rapid</span><span style="font-size:12px;color:#948b7b">You can change this later</span></div>`;body=`<div class="setup"><div class="eyebrow">Your local assistant</div><h1>A good place to start.</h1><p>We've picked a model for everyday writing and questions.<br>It's already on this Mac, so there's nothing to download.</p><div class="model-card"><div class="recommended">RECOMMENDED STARTER</div><h2>Qwen 3.5</h2><p>A balanced choice for writing, explanations, and everyday help.<br>Runs locally and works offline after setup.</p><div class="specs"><span style="color:#5f8169">✓ Already downloaded</span><span>2.85 GB on disk</span><span>4B · 4-bit <span class="chev">ⓘ</span></span></div><div class="check">✓</div></div><div class="alternatives"><span>Want a different balance of quality and speed?</span><span style="color:#51483a">Compare models &nbsp; ↗</span></div><div class="setup-footer"><button class="btn quiet">Not now</button><button class="btn">Prepare my assistant &nbsp; →</button></div><div style="border-top:1px solid #e7e1d6;margin-top:26px;padding-top:20px;color:#928878;font-size:12px">Uses the downloaded model already on this Mac. No download starts here.</div></div>`}
if(screen==='privacy'){title='06 / Trust — make the local promise precise and disclose network boundaries';rail=setupNav;topContent=`<div class="topbar"><span style="color:#948b7b;font-size:12px">Set up Rapid</span><span style="font-size:12px;color:#948b7b">Private by default</span></div>`;body=`<div class="setup" style="max-width:714px"><div class="eyebrow">On your terms</div><h1>Your AI runs on this Mac.</h1><p>Chat without an account or subscription.<br>Standard chat is processed locally.</p><div class="privacy-row"><span class="icon">◈</span><div><strong>Your conversations stay local in Chat only mode</strong><p>Replies are generated on your Mac. No chat content is sent to a cloud model.</p></div></div><div class="privacy-row"><span class="icon">↗</span><div><strong>Online tools are optional</strong><p>Search sends a query to a search service. Browsing contacts a website.<br>Rapid explains what will be sent before you enable these tools.</p></div></div><div class="privacy-row"><span class="icon">↓</span><div><strong>Setup and updates need a connection</strong><p>Downloading models and checking for updates use the internet.<br>Once prepared, ordinary chat works offline.</p></div></div><div class="privacy-row" style="border-bottom:0"><span class="icon">◌</span><div><strong>Anonymous usage data</strong><p>Never includes your messages or attachments.<br>Review or change your choice in Settings → Privacy.</p></div><span style="margin-left:auto;font-size:12px;color:#817563">Review ↗</span></div><div class="setup-footer"><button class="btn quiet">Privacy details ↗</button><button class="btn">Continue &nbsp; →</button></div></div>`}
if(screen==='drafts'){title='08 / Drafts belong to their conversation — restore them when switching or reopening';topContent=header('Cedar workshop invitation');rail=navigation.replace('nav active','nav').replace('A more thoughtful follow-up','Cedar workshop invitation').replace('Notes from Monday','Workshop budget · Draft').replace('A weekend in the mountains','Saturday at home');body=`<div class="article"><div class="user">Use the second title. Draft a two-sentence invitation for Friday at 2 pm in Room Cedar.</div><div class="assistant-title"><span class="mark" style="width:21px;height:21px;font-size:12px;border-radius:6px">R</span>Rapid</div><p>Join us for “The Feedback Flow” this Friday at 2 pm in Room Cedar. We’ll practise giving feedback that is clear, useful, and kind.</p><div class="response-actions"><span>⧉ Copy</span><span>↻ Try again</span><span>···</span></div></div>`;after=composer('Please add a note asking everyone to RSVP by Thursday.').replace('Answered locally. AI can make mistakes.','Draft saved on this Mac · Only in this conversation');}
if(screen==='unsupported'){title='09 / Attachment recovery — explain the format, keep the user’s message';topContent=header('New conversation');body=`<div class="welcome"><div class="small-logo">▤</div><h1>Make sense of a document.</h1><p>Attach a PDF, CSV, or TXT file.<br>Then ask about the parts that matter to you.</p></div>`;after=`<div class="queue"><div class="notice" style="margin-bottom:0;align-items:flex-start;background:#fbf5e9;border-color:#e9d8b9"><span style="font-size:21px;color:#ac7b2f">▤</span><div style="flex:1"><strong>We couldn’t attach this Word document</strong><small>cedar-workshop-notes.docx</small><div style="font-size:12px;color:#84745a;margin-top:7px">Export it as a PDF, or choose a CSV or TXT file. Your message is still here.</div><button class="btn secondary" style="font-size:12px;padding:8px 12px;margin-top:12px">Choose another file</button></div><span style="color:#a08f72">×</span></div></div>`+composer('Summarize this workshop brief.');}
if(screen==='focus'){title='10 / Ready to type — New chat puts the caret in the composer';topContent=header();body=empty();after=composer().replace('class="composer"','class="composer" style="border-color:#bf914b;box-shadow:0 0 0 3px #cfae7318"').replace('Message Rapid…','<span style="display:inline-block;height:20px;border-left:2px solid #b47c29;margin-right:3px;vertical-align:middle"></span>Message Rapid…').replace('Answered locally. AI can make mistakes.','Enter to send · Shift+Enter for a new line');}
document.getElementById('window').innerHTML=`<aside class="rail">${rail}</aside><main class="content">${topContent}<div class="surface">${body}</div>${after}</main>`;
document.getElementById('caption').textContent=title;
</script>
</html>
