name: kilo-code
display_name: "Kilo Code"
repo: "Kilo-Org/kilocode"
stars: 25500

# Kilo Code (https://github.com/Kilo-Org/kilocode) has a VS Code extension,
# JetBrains plugin, and standalone CLI. CLI 1.x and later uses Kilo's own
# config root; the 7.x CLI still reads this file.
#
# Kilo speaks the OpenAI-compatible /v1/chat/completions API through the
# OpenAI-compatible provider. The CLI reads the Kilo JSON config below.
# The extension has its own provider selection in its settings panel.
config:
  type: json
  path: "~/.config/kilo/kilo.json"
  template: |
    {
      "$schema": "https://app.kilo.ai/config.json",
      "model": "rapid-mlx/{model_id}",
      "provider": {
        "rapid-mlx": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Rapid-MLX",
          "options": {
            "apiKey": "not-needed",
            "baseURL": "{base_url}"
          },
          "models": {
            "{model_id}": {
              "name": "{model_id} (Rapid-MLX)",
              "tool_call": true,
              "reasoning": true,
              "limit": {"context": {context_length}, "output": 8192}
            }
          }
        }
      }
    }

models:
  # Kilo tool-calls heavily (file read/write + shell + browser + MCP) —
  # 9B is the practical floor; 30B+ works best for multi-turn refactors.
  recommended:
    - "qwen3-coder-30b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.5-9b-4bit"
    - "gpt-oss-20b-mxfp4-q8"

streaming:
  extra_tool_tags: []
  # Kilo inherits Cline's tool surface — file / shell / browser /
  # search / MCP. Cap at 25.
  max_tools: 25

testing:
  binary: kilo
  # The current CLI supports one-shot mode and auto approval for tool calls.
  # Pin the throwaway test workspace explicitly: Kilo otherwise reuses its
  # last project root and can read the caller's real checkout despite the
  # child process cwd. `--pure` also prevents user-installed plugins from
  # entering a compatibility/supply-chain test.
  query_cmd: "kilo run --dir '{cwd}' --pure --auto '{query}'"
  query_timeout: 180
  install_cmd: "npm install -g @kilocode/cli"

capabilities:
  function_calling: true
  streaming: true

known_issues:
  - "Kilo Code is a Cline fork with independent maintenance — do not point Kilo at a Cline config; the schema drifted after the split."
  - "Kilo CLI 1.0 and later use ~/.config/kilo/kilo.json[c]; older OpenCode config directories are no longer a fallback."
