name: qwen-code
display_name: "Qwen Code"
repo: "QwenLM/qwen-code"
stars: 25700

# Qwen Code (https://github.com/QwenLM/qwen-code) is Alibaba's fork of
# gemini-cli — a Node CLI coding agent tuned for Qwen3.x tool-calling.
# It speaks the OpenAI-compatible /v1/chat/completions API via a
# baseUrl config that maps 1:1 onto rapid-mlx's default endpoint. No
# response transform needed — plain OpenAI wire.
#
# Config lives at ~/.qwen/settings.json (project-level .qwen/settings.json
# is also supported). A selected modelProviders entry supplies its endpoint
# and reads its credential from the named envKey.
config:
  type: json
  path: "~/.qwen/settings.json"
  template: |
    {
      "modelProviders": {
        "openai": [
          {
            "id": "{model_id}",
            "name": "{model_id} (Rapid-MLX)",
            "envKey": "RAPID_MLX_API_KEY",
            "baseUrl": "{base_url}",
            "generationConfig": {
              "timeout": 300000,
              "maxRetries": 1,
              "contextWindowSize": {context_length},
              "samplingParams": {"max_tokens": 8192}
            }
          }
        ]
      },
      "env": {"RAPID_MLX_API_KEY": "not-needed"},
      "security": {"auth": {"selectedType": "openai"}},
      "model": {"name": "{model_id}"}
    }

models:
  # qwen-code was trained on Qwen3-Coder-* — those aliases plus Qwen3.6
  # are the sweet spot. Non-Qwen models work at reduced quality.
  recommended:
    - "qwen3-coder-30b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.6-27b-4bit"

streaming:
  extra_tool_tags: []
  # qwen-code exposes shell + file + web + git tools — 12 tool slots
  # plus a few bookkeeping calls. Cap at 15.
  max_tools: 15

testing:
  binary: qwen
  # qwen-code has a one-shot mode: `qwen -p "<prompt>"` runs without a
  # REPL. Useful for CI smokes.
  query_cmd: "qwen -p '{query}'"
  # Qwen Code can inject a large system prompt and tool list; allow a full
  # local tool-result round trip rather than classifying prefill as a hang.
  query_timeout: 360
  install_cmd: "npm install -g @qwen-code/qwen-code@latest"

capabilities:
  function_calling: true
  streaming: true

known_issues:
  - "Qwen3.5 9B sometimes answers a file task without calling offered tools; prefer a larger recommended coding model for reliable edits"
  - "Set the OpenAI provider baseUrl to the full `http://localhost:8000/v1` endpoint; Qwen Code sends chat completions relative to that URL."
