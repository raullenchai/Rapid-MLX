name: continue
display_name: "Continue.dev"
repo: "continuedev/continue"
stars: 30000

# Setup is handled by agents.setup because Continue's model list needs an
# update-in-place operation rather than a generic dict deep merge. Continue
# (IDE extensions and the cn CLI) reads ~/.continue/config.yaml; the legacy
# config.json is only read while no config.yaml exists.
config:
  type: yaml
  path: "~/.continue/config.yaml"

models:
  recommended:
    - "qwen3.6-35b-4bit"
    - "qwen3.5-9b-4bit"

capabilities:
  function_calling: true
  streaming: true
