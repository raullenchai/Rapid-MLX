name: opencode
display_name: "OpenCode"
repo: "anomalyco/opencode"
stars: 16000

# OpenCode (opencode.ai) is a Claude-Code-like terminal coding agent.
# OpenCode 1.x reads `provider`; 2.x reads `providers`.  Keep both shapes in
# one file so setup works with either installed CLI.  2.x accepts the legacy
# field but can omit a custom provider from its available model registry.
#
# Config lives at ~/.config/opencode/opencode.json (or ./opencode.json in
# a project root). The ``$schema`` URL is canonical from opencode.ai.
config:
  type: json
  path: "~/.config/opencode/opencode.json"
  template: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "rapid-mlx": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Rapid-MLX",
          "options": {
            "baseURL": "{base_url}",
            "apiKey": "{rapid_api_key}"
          },
          "models": {
            "{model_id}": {}
          }
        }
      },
      "providers": {
        "rapid-mlx": {
          "package": "@opencode/ai/providers/openai-compatible",
          "name": "Rapid-MLX",
          "settings": {
            "baseURL": "{base_url}",
            "apiKey": "{rapid_api_key}"
          },
          "models": {
            "{model_id}": {
              "name": "{model_id}",
              "limit": {"context": {context_length}, "output": 8192},
              "capabilities": {"tools": true, "input": ["text"], "output": ["text"]}
            }
          }
        }
      },
      "model": "rapid-mlx/{model_id}"
    }

models:
  recommended:
    - "qwen3-coder-30b-4bit"
    - "qwen3.5-9b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.5-4b-4bit"

streaming:
  extra_tool_tags: []
  max_tools: 25  # mirrors Claude Code tool count

testing:
  binary: opencode
  # `opencode run '<prompt>'` is the headless one-shot mode (verified
  # 2026-10-02, opencode 1.18.34: T1–T6 + follow-up pass). `--continue`
  # appends to the last session in the cwd.
  query_cmd: "opencode run '{query}'"
  query_timeout: 120
  install_cmd: "brew install sst/tap/opencode  # or: npm install -g opencode-ai"

capabilities:
  function_calling: true
  streaming: true

known_issues:
  - "Config schema may need updating across OpenCode versions — if this template doesn't load, run `opencode --help` and check `~/.config/opencode/opencode.json` against the docs at opencode.ai."
  - "First run of OpenCode may prompt for an Anthropic API key — choose 'skip' since rapid-mlx is providing the model via the openai-compat provider."
  - "Follow-ups in headless mode: `opencode run --continue '<query>'` reuses the last session in the cwd (verified)."
