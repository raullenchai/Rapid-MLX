name: openhands
display_name: "OpenHands"
repo: "All-Hands-AI/OpenHands"
stars: 71000

config:
  type: env
  env_vars:
    LLM_BASE_URL: "{base_url}"
    LLM_API_KEY: "not-needed"
    LLM_MODEL: "openai/{model_id}"

models:
  recommended:
    - "qwen3.5-9b-4bit"
    - "qwen3.6-35b-4bit"
    - "qwen3.5-4b-4bit"

streaming:
  extra_tool_tags: []
  max_tools: 16

testing:
  binary: openhands
  query_cmd: "openhands --override-with-envs --headless --always-approve -t '{query}'"
  query_timeout: 300
  install_cmd: "uv tool install openhands --python 3.12"

capabilities:
  function_calling: true
  streaming: true

known_issues:
  - "OpenHands CLI 1.x applies LLM_* only with --override-with-envs"
  - "The CLI can run local tools without Docker; the full GUI server needs Docker"
  - "Uses LiteLLM under the hood — prefix the local model with openai/"
  - "The CLI sends a large system prompt and several tool definitions; small local models may struggle with file edits"
