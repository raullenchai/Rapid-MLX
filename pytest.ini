[pytest]
# Pytest configuration for Rapid-MLX

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (require model loading, deselect with '-m "not slow"')
    integration: marks tests as integration tests (require running server)
    needle: PFlash needle-in-haystack quality gate (#287) — requires PFLASH_NEEDLE_MODEL and a real model load; skipped by default.
    requires_mlx: marks tests that import or otherwise need mlx; auto-skipped by
        tests/conftest.py when mlx is unavailable (the no-MLX CI leg). It is NOT
        in the addopts `-m` default exclusion, so a local dev run still executes
        these tests when mlx is installed.

# Default options
addopts =
    -v
    --tb=short
    -m "not slow and not integration and not needle"

asyncio_mode = auto

# Warning policy. Do NOT blanket-ignore DeprecationWarning/UserWarning: with
# mlx / mlx-lm / transformers / pydantic moving fast, deprecations raised from
# our own code are the earliest signal of the next breaking upgrade.
#   - DeprecationWarnings attributed to rapid_mlx code fail the test. The
#     filter keys on the frame the warning is attributed to, so this catches
#     rapid_mlx calling a deprecated dependency/stdlib API. Our own
#     ``warnings.warn(..., stacklevel=2)`` deprecations hit from a test are
#     attributed to the test and only shown; assert those with pytest.warns.
#   - Pytest collection/deprecation warnings fail too (they mean a test is
#     silently not collected or will break on the next pytest major).
#   - Everything else uses pytest's default: shown in the warnings summary.
filterwarnings =
    error::DeprecationWarning:rapid_mlx(\..*)?
    error::PendingDeprecationWarning:rapid_mlx(\..*)?
    error::pytest.PytestCollectionWarning
    error::pytest.PytestDeprecationWarning
