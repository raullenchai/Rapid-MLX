[pytest]
# Pytest configuration for Rapid-MLX

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (require model loading, deselect with '-m "not slow"')
    integration: marks tests as integration tests (require running server)
    needle: PFlash needle-in-haystack quality gate (#287) — requires PFLASH_NEEDLE_MODEL and a real model load; skipped by default.
    requires_mlx: marks tests that import or otherwise need mlx; auto-skipped by
        tests/conftest.py when mlx is unavailable (the no-MLX CI leg). It is NOT
        in the addopts `-m` default exclusion, so a local dev run still executes
        these tests when mlx is installed.

# Default options
addopts =
    -v
    --tb=short
    -m "not slow and not integration and not needle"

# Ignore warnings from dependencies
asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
