# Compile gate for the rapid-mac desktop app on pull requests.
#
# Until now the ONLY workflow that touched apps/rapid-mac was
# rapid-mac-release.yml, which fires solely on `rapid-mac-v*` tags — so a PR
# could land a change that did not even compile, and nothing caught it until a
# human cut a release. This job builds the Swift package on every PR that
# touches the app, so a non-compiling change fails in review instead.
#
# The SPM test target was stripped (see apps/rapid-mac/Package.swift — the strip
# deleted the subsystems most of the suite exercised, so it no longer compiles,
# and `swift test` can't resolve `import Testing` in this toolchain). Keep the
# full-app compile gate and run focused dependency-free contract executables for
# regressions that can be isolated from the removed test stack.
#
# Second gate: `accessibility-identifiers` keeps the GUI golden-flow harness from
# silently losing coverage. It fails a PR that ADDS an interactive control with
# no `.accessibilityIdentifier(...)` — see the script's module docstring for the
# rationale, the escape hatch, and the shapes it deliberately does not detect.
#
# Third gate: `gui-golden-flows` actually RUNS that harness. The identifier gate
# only ensures new controls are reachable; nothing was checking that the
# journeys still pass or that the committed AX baselines still describe the app.
# They did not — #1705 shipped a new sidebar button and left all 12 baselines
# stale. See the job's own comment for why a hosted runner can drive it.
name: rapid-mac CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One in-flight build per PR branch; a new push cancels the previous run.
concurrency:
  group: rapid-mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.policy.outputs.desktop }}
      full_gate: ${{ steps.policy.outputs.full_gate }}
      gui_flows: ${{ steps.policy.outputs.gui_flows }}
      gui_flow_count: ${{ steps.policy.outputs.gui_flow_count }}
      gui_shards: ${{ steps.policy.outputs.gui_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify desktop lane
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # A future merge queue candidate may combine independently scoped
            # PRs, so validate both product lanes.
            python scripts/classify_ci_changes.py --github-output "$GITHUB_OUTPUT"
            python scripts/select_gui_flows.py --github-output "$GITHUB_OUTPUT"
            {
              echo 'full_gate=true'
            } >> "$GITHUB_OUTPUT"
          else
            # Keep integration promotion scoped to the lanes selected by the
            # real PR diff. An engine-only PR must not allocate a full GUI run,
            # and a Desktop-only PR must not allocate model runners.
            # Disable rename folding so both the removed source path and the
            # new destination participate in classification.
            git diff --no-renames --name-only "$PR_BASE_SHA" "$GITHUB_SHA" > /tmp/changed-paths
            python scripts/classify_ci_changes.py \
              --paths-file /tmp/changed-paths \
              --github-output "$GITHUB_OUTPUT"
            python scripts/select_gui_flows.py \
              --paths-file /tmp/changed-paths \
              --github-output "$GITHUB_OUTPUT"
            full_gate=false
            if [ "$HEAD_REPO" = "$REPO" ] && \
              { [[ "$HEAD_REF" == train/* ]] || \
                [[ "$HEAD_REF" =~ ^mergify/merge-queue/[0-9a-f]{10}$ ]]; }; then
              full_gate=true
            fi
            echo "full_gate=$full_gate" >> "$GITHUB_OUTPUT"
          fi

  # Pure text lint over the diff — no Swift toolchain, no simulator, no app
  # build. It runs on ubuntu in ~15s beside the multi-minute macOS build rather
  # than inside it, so a missing identifier reads as its own red check with its
  # own log instead of hiding at the bottom of a compile job.
  accessibility-identifiers:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The gate is scoped to lines this PR ADDED, which needs the
          # merge-base with the target branch — not a shallow single commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # actions/checkout with fetch-depth 0 normally leaves origin/<base> in place;
      # this is the same belt-and-braces fetch the mlx-bound-guard job in ci.yml
      # does, so the merge-base lookup cannot fail on a runner that resolved
      # refs differently.
      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      # Stdlib only — deliberately no pip install, so the gate cannot be taken
      # down by an unrelated dependency resolution failure.
      - name: Interactive controls carry an accessibility identifier
        run: |
          python scripts/check_rapid_mac_ax_identifiers.py \
            --base-ref "origin/${{ github.base_ref || 'main' }}"


  # The detector job above is a NO-OP on a PR that changes no Swift — which is
  # exactly the shape of a PR that edits the detector. Without this suite, the
  # wrapper-identifier fix, the qualifier fix or the carry-over accounting could
  # all be reverted in a script-only PR with every job green, while the test
  # pinning them failed locally.
  #
  # Its OWN job, not a step in the one above, because it needs pytest from PyPI
  # and that job is deliberately stdlib-only: a registry incident must be able
  # to redden the tests without also taking down the gate that needs no
  # network at all.
  accessibility-identifier-tests:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      # ``-q`` but not ``-x``: a change to the detector usually breaks several
      # pinned cases at once, and seeing all of them is the point.
      - name: Gate regression suite
        run: pytest tests/test_rapid_mac_ax_identifiers.py -q

  # Text-only contracts protecting the golden-flow harness itself. Ubuntu is
  # deliberate: the suites read captured dumps, script sources, and the fake
  # sidecar fixture, so they cost seconds, need no GPU or GUI, and — for the
  # OS-independence suite especially — must not themselves depend on a macOS
  # version.
  #
  # These guard the ways this gate can rot into uselessness:
  #
  #   * a baseline that only one macOS can produce. Developers here are on
  #     macOS 26 and the runner is macOS 15, so any OS-variable attribute that
  #     reaches a baseline means whoever runs --update-baselines turns CI red
  #     for everyone, and regenerating on the other side turns it red locally.
  #   * a deleted preflight. Removing it breaks nothing on a healthy machine;
  #     it only restores the misdiagnosis on an unhealthy one, where a missing
  #     permission or a locked screen again reads as "the app is broken".
  #   * a fake sidecar that drifts from the Swift catalog parser it feeds:
  #     nothing else notices, and the failure surfaces on a Mac, hours later,
  #     disguised as a product defect.
  gui-harness-contracts:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install GUI contract test dependencies
        run: pip install pytest PyYAML

      # Separate steps so a red names which contract broke.
      - name: Baselines are OS-independent
        run: pytest tests/test_ax_baseline_os_variance.py -q

      - name: GUI preflight contract
        run: pytest tests/test_gui_preflight_contract.py -q

      - name: GUI golden-flow coverage contract
        run: |
          pytest \
            tests/test_gui_app_artifact.py \
            tests/test_gui_golden_ci_coverage.py \
            tests/test_gui_flow_routing.py \
            -q

      - name: Fake sidecar catalog contract
        run: pytest tests/test_fake_sidecar_image_catalog.py -q

      - name: GUI and XCUITest workflow contracts
        run: |
          pytest \
            tests/test_ax_baseline.py \
            tests/test_gui_control_behavior_contract.py \
            tests/test_gui_walk_completeness.py \
            tests/test_rapid_mac_xcui_target.py \
            -q

  build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # macos-15 → default Xcode 16 → Swift 6.0, matching Package.swift's
    # swift-tools-version and the release workflow's runner. macos-latest still
    # resolves to macos-14 (Swift 5.x) on GitHub-hosted runners.
    runs-on: macos-15
    # A hung test would otherwise sit on the 6-hour default. The whole
    # job is ~2 min warm; 20 leaves room for a cold package resolve and
    # still fails fast. Learned the hard way: a headless-incompatible
    # dependency deadlocked every @MainActor test and burned 45 minutes
    # of runner time before anyone noticed.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rapid-mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: swift build
        run: swift build

      # The suite is back in the manifest (see Package.swift). It had been
      # excluded, so nothing compiled or ran ~3,100 test functions — which is
      # how a starter model that degenerates on an ordinary chat question
      # shipped for months while tests pinning that exact alias sat dormant.
      # --no-parallel is load-bearing, not a preference. swift-testing
      # parallelises across a cooperative pool sized to the core count, and
      # several suites here call `proc.waitUntilExit()` — a synchronous
      # blocking wait. On this 12-core dev machine there is enough slack to
      # absorb that; on a GitHub runner there is not, and the pool starves:
      # the first attempt logged 1,416 tests started, ZERO finished, and sat
      # there until the job timed out, leaving orphan `head` / `swiftpm-testing`
      # processes behind. Serialised it is 15s vs 4s locally — cheap insurance.
      #
      # The real fix is to stop blocking threads inside async tests; until
      # then, do not drop this flag.
      #
      # #2488: wrapped by scripts/desktop-test-timeout.sh so a hung suite
      # (per-suite .timeLimit(.minutes(2)) on the hang-prone suites) or a hung
      # whole run (per-run deadline + /usr/bin/sample + ps + vm_stat artifact)
      # fails fast with a readable reason instead of burning the job timeout.
      - name: swift test
        run: ./scripts/desktop-test-timeout.sh

      # #2488: upload the hang-sample artifact (stack + system state) so the
      # cause of a hung/failed desktop-test run is inspectable from the CI log
      # without re-running. `if-no-files-found: ignore` keeps healthy runs from
      # failing on an empty artifact dir.
      - name: Upload Desktop test hang sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: desktop-test-hang-sample-${{ github.sha }}
          path: apps/rapid-mac/build/desktop-hang-artifacts
          if-no-files-found: ignore
          retention-days: 1

      # Kept alongside `swift test` rather than folded into it: this script
      # runs without the test target, so it stays usable while bisecting a
      # manifest problem, and it covers the install.sh <-> app tier contract
      # that no Swift test can see.
      - name: verify recommendation + eligibility contracts
        run: swift scripts/verify-recommendation-tiers.swift

      - name: Verify conversation history ordering
        run: scripts/verify-conversation-ordering.sh

      # Same standalone-script pattern: pins the chat send's inactivity
      # timeout to a local-appropriate bound so a silent server surfaces
      # an actionable, retryable failure instead of a multi-minute hang.
      - name: verify chat timeout contract
        run: swift scripts/verify-chat-timeout.swift

  # Build the release-shaped, sidecar-free app exactly once for every full
  # Desktop gate. GUI consumers must use this commit-bound artifact instead of
  # compiling their own copy. Keeping this as a dedicated producer makes the
  # next step (parallel journey shards) cheap without trusting a cache as test
  # evidence: the archive and its manifest are immutable outputs of this run.
  gui-app-build:
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' &&
      needs.changes.outputs.full_gate == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rapid-mac
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build release-shaped GUI app
        env:
          SKIP_SIDECAR: "1"
          RAPID_BUILD_CONFIG: release
        run: ./scripts/build.sh

      - name: Verify and package GUI app
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/gui-app-artifact
        run: |
          set -euo pipefail
          app="build/Rapid-MLX Desktop.app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$ARTIFACT_DIR"
          ditto -c -k --keepParent "$app" "$ARTIFACT_DIR/Rapid-MLX-Desktop.zip"
          python ../../scripts/gui_app_artifact.py create \
            --archive "$ARTIFACT_DIR/Rapid-MLX-Desktop.zip" \
            --source-sha "$GITHUB_SHA" \
            --output "$ARTIFACT_DIR/manifest.json"

      - name: Upload commit-bound GUI app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-gui-app-${{ github.sha }}
          path: ${{ runner.temp }}/gui-app-artifact
          if-no-files-found: error
          retention-days: 1

  # Drives the REAL .app through real user journeys and diffs the resulting
  # accessibility tree against committed structural baselines.
  #
  # Why this job exists: apps/rapid-mac/scripts/gui-golden-flows.sh and its
  # baselines under Tests/GUIGoldenFlows/__Snapshots__ once ran in NO workflow at
  # all. A regression net that only fires when a human remembers to run it is
  # not a net, and it had already failed: #1705 added the Images sidebar button
  # and left every one of the 12 baselines stale, with every check green.
  #
  # A NOTE ON WHY THIS IS POSSIBLE AT ALL. Reading another process's AX tree
  # needs the caller to hold TCC Accessibility, which is normally interactive
  # and lives in the SIP-protected system TCC database. GitHub bakes the grant
  # into the runner image instead: images/macos/scripts/build/configure-tccdb-
  # macos.sh in actions/runner-images inserts kTCCServiceAccessibility with
  # auth_value 2 (allowed) for /bin/bash and for the agent that parents the
  # runner, and configure-autologin.sh gives the VM a real logged-in Aqua
  # session so an .app can actually open a window. Both are image properties,
  # not promises — which is what the preflight step below is for.
  gui-golden-flows:
    needs:
      - changes
      - gui-app-build
    if: >-
      needs.changes.outputs.desktop == 'true' &&
      needs.changes.outputs.full_gate == 'true'
    # macos-15 for the same reason as the build job: Package.swift is
    # swift-tools-version 6.0, and macos-14 still defaults to Swift 5.x.
    runs-on: macos-15
    strategy:
      # A failure in one product journey must not cancel independent evidence
      # from the other selected groups. The stable desktop-tests facade still
      # blocks unless every matrix child succeeds.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.gui_shards) }}
    # The shared app is already built. Individual flows are usually seconds
    # each (6-11 s on an M3 Ultra), while hosted-runner launch variance can be
    # much higher. 30 minutes catches a wedged shard far before the six-hour
    # default without weakening the existing journey time budget.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/rapid-mac
    env:
      # Each matrix child receives only one manifest group. Every named step
      # remains visible, but the harness exits before launch for journeys owned
      # by another shard. Separate hosted VMs isolate HOME, defaults, ports,
      # app processes, and result directories by construction.
      GUI_FLOWS: ${{ matrix.gui_flows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # BEFORE the build, because it is the cheap question and the one most
      # likely to be answered "no" by a future runner-image change. If the
      # image ever drops the Accessibility grant, every AX read returns
      # nothing, `dump` yields a tree containing only the application root,
      # and the flows would die on "main window did not appear" — blaming the
      # app for a permission problem. This step makes that failure say what it
      # actually is, in 30 s, instead of after a five-minute build.
      #
      # It is deliberately fail-closed: no Dock means no GUI session, which
      # means the app could not have opened a window either.
      - name: Accessibility + GUI session preflight
        run: |
          set -euo pipefail
          swiftc scripts/rapid-ax.swift -o "$RUNNER_TEMP/rapid-ax"
          dock_pid="$(pgrep -x Dock | head -1 || true)"
          if [[ -z "$dock_pid" ]]; then
            echo "::error::No Dock process: this runner has no logged-in GUI (Aqua) session, so the app cannot open a window."
            exit 1
          fi
          echo "Dock pid: $dock_pid"
          "$RUNNER_TEMP/rapid-ax" trust "$dock_pid"

      - name: Download commit-bound GUI app
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: rapid-gui-app-${{ github.sha }}
          path: ${{ runner.temp }}/gui-app-artifact

      # Do not merely trust the artifact name. Verify both its declared source
      # commit and its bytes before extraction, then verify the app's code seal.
      # Missing, stale, corrupt, or substituted artifacts therefore fail the
      # merge gate before any journey launches.
      - name: Verify and extract GUI app
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/gui-app-artifact
        run: |
          set -euo pipefail
          python ../../scripts/gui_app_artifact.py verify \
            --archive "$ARTIFACT_DIR/Rapid-MLX-Desktop.zip" \
            --manifest "$ARTIFACT_DIR/manifest.json" \
            --expected-source-sha "$GITHUB_SHA"
          rm -rf "build/Rapid-MLX Desktop.app"
          mkdir -p build
          ditto -x -k "$ARTIFACT_DIR/Rapid-MLX-Desktop.zip" build
          codesign --verify --deep --strict "build/Rapid-MLX Desktop.app"

      # #1719 — the first native XCUITest journey complements (and does not
      # replace) the AX flows below. XCTest can capture an individual element,
      # which closes the one gap AX structurally cannot: prove two gallery
      # records actually draw different pixels rather than the same bitmap.
      - name: 'XCUITest: image-generation pixels'
        id: xcui
        if: contains(fromJSON(matrix.gui_flows), 'image-generation')
        continue-on-error: true
        env:
          RAPID_XCUI_RESULT_BUNDLE: ${{ runner.temp }}/RapidImageUITests.xcresult
          RAPID_XCUI_ONLY_TESTING: RapidUITests/ImageGenerationPixelTests
        run: ./scripts/run-xcui-tests.sh

      - name: 'XCUITest: chat attachment ownership'
        id: chat_xcui
        if: >-
          contains(fromJSON(matrix.gui_flows), 'chat-multimodal-attachments') ||
          contains(fromJSON(matrix.gui_flows), 'chat-document-attachment')
        continue-on-error: true
        env:
          RAPID_XCUI_RESULT_BUNDLE: ${{ runner.temp }}/RapidChatAttachmentUITests.xcresult
          RAPID_XCUI_ONLY_TESTING: RapidUITests/ChatAttachmentJourneyTests
        run: ./scripts/run-xcui-tests.sh

      - name: Upload XCUITest evidence
        if: steps.xcui.outcome == 'failure' || steps.chat_xcui.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-xcui-evidence-${{ matrix.group }}
          path: ${{ runner.temp }}/Rapid*UITests.xcresult
          if-no-files-found: ignore

      # One step per flow so a red check names the journey that broke rather
      # than "golden flows failed". Each needs its own output directory: the
      # harness refuses to start on a non-empty one.
      #
      # Every named flow below drives the app through `rapid-ax` alone (see
      # `flow_requires_peekaboo` in the harness). The aggregate `all` mode still
      # permits optional screenshot evidence through Peekaboo, but screenshots
      # are not assertions and therefore are not a CI dependency.
      #
      # `chat-depth` is peekaboo-free but deliberately NOT run here. It asserts
      # that all five turns are present in the accessibility tree at once, and
      # the transcript is a virtualized scroll view: on this runner's 1024x681
      # window the first user bubble is scrolled out and unrealized by turn 4,
      # so the tree honestly reports 3 user + 4 model with a COMPLETE walk. That
      # is the app working as designed, not a regression, and it cannot be fixed
      # by a bigger window on a 1024x768 screen. Its assertions are only valid
      # where the whole transcript fits, so it is the ONE explicitly excluded
      # named flow. `test_gui_golden_ci_coverage.py` fails if any other flow is
      # absent from this job, or if this exception silently grows.
      - name: 'Golden flow: fresh-install'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow fresh-install
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/fresh-install

      - name: 'Golden flow: cached-quickstart'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow cached-quickstart
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/cached-quickstart

      - name: 'Golden flow: cached-curated-tradeup'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow cached-curated-tradeup
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/cached-curated-tradeup

      - name: 'Golden flow: cached-variant-collapse'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow cached-variant-collapse
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/cached-variant-collapse

      - name: 'Golden flow: model-switch-active-request'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow model-switch-active-request
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/model-switch-active-request

      - name: 'Golden flow: download-progress'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow download-progress
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/download-progress

      - name: 'Golden flow: settings-persistence'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow settings-persistence
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/settings-persistence

      - name: 'Golden flow: chat-restore'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow chat-restore
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/chat-restore

      # Exercise the vision sidecar before the long sequence of isolated app
      # launches below can create artificial cold-start pressure on the hosted
      # Mac. Payload correctness is still asserted by the flow itself.
      - name: 'Golden flow: chat-multimodal-attachments'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow chat-multimodal-attachments
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/chat-multimodal-attachments

      - name: 'Golden flow: restored-tools'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow restored-tools
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/restored-tools

      - name: 'Golden flow: tool-loop-budget'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow tool-loop-budget
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/tool-loop-budget

      - name: 'Golden flow: math-rendering'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow math-rendering
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/math-rendering

      - name: 'Golden flow: slow-stream-stop'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow slow-stream-stop
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/slow-stream-stop

      - name: 'Golden flow: model-crash-recovery'
