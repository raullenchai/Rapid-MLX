      - name: 'Golden flow: update-busy'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow update-busy
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/update-busy

      - name: 'Golden flow: campaign-banner'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow campaign-banner
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/campaign-banner

      - name: 'Golden flow: launch-integrations'
        continue-on-error: true
        run: ./scripts/gui-golden-flows.sh --flow launch-integrations
        env:
          RAPID_GUI_GOLDEN_OUT: ${{ runner.temp }}/golden/launch-integrations

      # Individual steps continue so one runner reports every broken journey
      # in a single pass. This final verdict is the gate: missing result files,
      # malformed evidence, and any explicit failure all keep the PR red.
      - name: Require every named golden flow
        if: always()
        env:
          GOLDEN_ROOT: ${{ runner.temp }}/golden
          EXPECTED_FLOW_COUNT: ${{ matrix.flow_count }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GOLDEN_ROOT"])
          expected = int(os.environ["EXPECTED_FLOW_COUNT"])
          results = sorted(root.glob("*/result.json"))
          failures = []
          for path in results:
              try:
                  payload = json.loads(path.read_text())
              except (OSError, ValueError) as error:
                  failures.append(f"{path.parent.name}: unreadable result ({error})")
                  continue
              if payload.get("status") != "pass":
                  failures.append(
                      f"{path.parent.name}: {payload.get('status', 'missing status')}"
                  )
          if len(results) != expected:
              failures.append(f"expected {expected} result files, found {len(results)}")
          if failures:
              raise SystemExit("Golden flow gate failed:\n- " + "\n- ".join(failures))
          print(f"All {expected} named GUI golden flows passed")
          PY

      # Each harness invocation stops at its FIRST mismatched baseline, so one
      # red run can otherwise reveal only one structural difference per flow.
      # Regenerate every CI-gated flow that actually owns a baseline;
      # semantic-only flows have nothing to regenerate and rerunning them here
      # used to turn a fast failure into a 10+ minute diagnostic.
      #
      # So on failure, regenerate the whole set against a throwaway baseline
      # directory and diff it against the committed one. The result is "here is
      # everything this runner actually sees", in one artifact.
      #
      # `|| true` is on a DIAGNOSTIC, never on a check: this step only runs when
      # the job has already failed, and `if: failure()` steps cannot turn a red
      # job green. Swallowing errors here keeps a flow that dies for a
      # non-baseline reason from hiding the diff for the ones that did not.
      - name: Regenerate baselines on this runner (diagnostic)
        if: failure()
        env:
          GOLDEN_ROOT: ${{ runner.temp }}/golden
          SCRATCH: ${{ runner.temp }}/os-baselines
        run: |
          set -uo pipefail
          structural_failure=0
          for result in "$GOLDEN_ROOT"/*/result.json; do
            if jq -e '.status != "pass"' "$result" >/dev/null \
              && find "$(dirname "$result")" -name '*.observed.txt' -print -quit | grep -q .; then
              structural_failure=1
              break
            fi
          done
          if [[ "$structural_failure" != 1 ]]; then
            echo "No structural baseline mismatch; skipping baseline regeneration."
            exit 0
          fi
          mkdir -p "$SCRATCH/snapshots"
          cp Tests/GUIGoldenFlows/__Snapshots__/*.txt "$SCRATCH/snapshots/"
          for flow in fresh-install settings-persistence settings-mtp chat-restore slow-stream-stop model-crash-recovery update-state update-busy campaign-banner image-generation audio-readiness launch-integrations; do
            RAPID_GUI_BASELINE_DIR="$SCRATCH/snapshots" \
            RAPID_GUI_GOLDEN_OUT="$SCRATCH/run/$flow" \
              ./scripts/gui-golden-flows.sh --flow "$flow" --update-baselines || true
          done
          echo "=== committed (left) vs this runner (right) ==="
          diff -ru Tests/GUIGoldenFlows/__Snapshots__ "$SCRATCH/snapshots" \
            | tee "$SCRATCH/runner-vs-committed.diff" || true

      # A structural mismatch is only actionable with the observed tree beside
      # the committed one. The harness writes `<name>.observed.txt` next to the
      # raw AX dump it came from, which is what someone re-generating a
      # baseline needs to review the diff.
      - name: Upload AX evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gui-golden-flow-evidence-${{ matrix.group }}
          # Both halves: the failing flow's own dumps, and the full
          # runner-vs-committed regeneration from the diagnostic step above.
          path: |
            ${{ runner.temp }}/golden
            ${{ runner.temp }}/os-baselines
          retention-days: 7

      # The XCUITest is allowed to fail temporarily only so the established AX
      # journeys still execute and retain their independent evidence. Restore
      # the blocking verdict after AX diagnostics: placing it last keeps an
      # XCUITest-only failure from needlessly regenerating every AX baseline.
      - name: Require native XCUITest
        if: always()
        env:
          XCUI_OUTCOME: ${{ steps.xcui.outcome }}
          CHAT_XCUI_OUTCOME: ${{ steps.chat_xcui.outcome }}
          IMAGE_SELECTED: ${{ contains(fromJSON(matrix.gui_flows), 'image-generation') }}
          CHAT_SELECTED: ${{ contains(fromJSON(matrix.gui_flows), 'chat-multimodal-attachments') || contains(fromJSON(matrix.gui_flows), 'chat-document-attachment') }}
        run: |
          if [[ "$IMAGE_SELECTED" == true && "$XCUI_OUTCOME" != success ]]; then
            echo "::error::Native XCUITest failed ($XCUI_OUTCOME)"
            exit 1
          fi
          if [[ "$CHAT_SELECTED" == true && "$CHAT_XCUI_OUTCOME" != success ]]; then
            echo "::error::Native Chat attachment XCUITest failed ($CHAT_XCUI_OUTCOME)"
            exit 1
          fi
          echo "All selected native XCUITests passed"

  desktop-tests:
  # Stable required-check facade. It is present even on non-desktop PRs,
  # unlike workflow-level path filters. Ordinary PRs settle after the fast
  # Desktop lane; promoted and integration heads add the GUI golden-flow gate.
    needs:
      - changes
      - accessibility-identifiers
      - accessibility-identifier-tests
      - gui-harness-contracts
      - build
      - gui-app-build
      - gui-golden-flows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check desktop results
        env:
          DESKTOP_EXPECTED: ${{ needs.changes.outputs.desktop }}
          FULL_GATE: ${{ needs.changes.outputs.full_gate }}
          IDENTIFIERS: ${{ needs.accessibility-identifiers.result }}
          IDENTIFIER_TESTS: ${{ needs.accessibility-identifier-tests.result }}
          HARNESS_CONTRACTS: ${{ needs.gui-harness-contracts.result }}
          BUILD: ${{ needs.build.result }}
          GUI_APP_BUILD: ${{ needs.gui-app-build.result }}
          GOLDEN_FLOWS: ${{ needs.gui-golden-flows.result }}
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.result }}" != success ]; then
            echo "Desktop change classifier failed"
            exit 1
          fi
          if [ "$DESKTOP_EXPECTED" != true ]; then
            echo "Desktop lane not required for this PR"
            exit 0
          fi
          for result in "$IDENTIFIERS" "$IDENTIFIER_TESTS" "$HARNESS_CONTRACTS" "$BUILD"; do
            if [ "$result" != success ]; then
              echo "A desktop PR gate failed: $result"
              exit 1
            fi
          done
          if [ "$FULL_GATE" = true ]; then
            if [ "$GUI_APP_BUILD" != success ]; then
              echo "GUI app artifact build failed: $GUI_APP_BUILD"
              exit 1
            fi
            if [ "$GOLDEN_FLOWS" != success ]; then
              echo "GUI golden-flow merge gate failed: $GOLDEN_FLOWS"
              exit 1
            fi
          elif [ "$GUI_APP_BUILD" != skipped ] || [ "$GOLDEN_FLOWS" != skipped ]; then
            echo "Unpromoted head unexpectedly allocated a GUI golden-flow lane"
            exit 1
          fi
