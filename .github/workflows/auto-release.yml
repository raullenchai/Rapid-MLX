name: Auto-release on version bump

# When a commit lands on main with subject ``chore: bump version to X.Y.Z``,
# tag ``vX.Y.Z`` and publish a GitHub Release — BUT only after the Tier-1 agent
# gate passes on the self-hosted Apple-Silicon runner (the Studio). The existing
# ``publish.yml`` then publishes to PyPI on the ``release: published`` event.
#
# Flow:  detect (hosted)  →  tier1-agent-gate (self-hosted Studio)  →  release
# The release job ``needs`` the gate, so a version bump cannot tag or publish
# unless the four Tier-1 agents (Claude Code / Codex / Hermes / Aider) re-verify
# green against the exact source being released. Mirrors Apple MLX's
# ``publish needs: test_wheel``.
#
# EMERGENCY OVERRIDE: if the Studio runner is down and a release can't wait, a
# maintainer can run this workflow manually (``workflow_dispatch``) with
# ``force_version`` set — that BYPASSES the gate and releases anyway. It is
# audited (actor + reason are logged and stamped into the release notes). See
# RELEASE.md § "Studio down / emergency release".
#
# RELEASE NOTES: built by ``scripts/build_release_notes.sh`` (extracted so it can
# be tested offline — ``tests/release/test_build_release_notes.sh``). It prepends
# ``docs/release-notes/vX.Y.Z.md`` from the release commit when that file exists,
# and otherwise emits the plain commit list. See ``docs/release-notes/README.md``.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_version:
        description: "EMERGENCY only: release this exact version WITHOUT the Tier-1 gate (use when the Studio runner is down). Must equal pyproject.toml. Leave blank otherwise."
        required: false
        default: ""
      reason:
        description: "Why the gate is being bypassed (recorded in the release notes for audit)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # 1) Cheap detection on a hosted runner: is this a version bump we should
  #    release? Exposes should_release + version + force for downstream jobs.
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      force: ${{ steps.detect.outputs.force }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Detect version bump (or forced release)
        id: detect
        env:
          # Pass untrusted-ish dispatch inputs via env, never ``${{ }}`` into the
          # run block.
          EVENT: ${{ github.event_name }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          REASON: ${{ github.event.inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          # --- Emergency manual override (Studio down) ---------------------
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$FORCE_VERSION" ]; then
              echo "workflow_dispatch with no force_version — nothing to do."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "force=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️  FORCED release requested by @$ACTOR → v$FORCE_VERSION"
            echo "    reason: ${REASON:-<none given>}"
            echo "⚠️  The Tier-1 agent gate will be BYPASSED for this release."
            # workflow_dispatch lets the operator pick any ref; a production
            # release must come from protected main, never a feature/stale
            # branch that happens to carry the same version in pyproject.toml.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "❌ Forced release must be dispatched on main (got $GITHUB_REF)" >&2
              exit 1
            fi
            VERSION="$FORCE_VERSION"
            # Even a forced release must match pyproject and have a fresh tag.
            PROJECT_VER=$(grep -m1 '^version *=' pyproject.toml | awk -F'"' '{print $2}')
            if [ "$PROJECT_VER" != "$VERSION" ]; then
              echo "❌ force_version $VERSION != pyproject.toml $PROJECT_VER" >&2
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
              echo "Tag v$VERSION already exists — nothing to do (idempotent)"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "force=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "force=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Normal push path -------------------------------------------
          echo "force=false" >> "$GITHUB_OUTPUT"
          SUBJECT=$(git log -1 --pretty=%s)
          echo "subject: $SUBJECT"

          # Strict format: ``chore: bump version to X.Y.Z``, optionally followed
          # by GitHub's squash-merge suffix `` (#N)``.
          if ! echo "$SUBJECT" | grep -qE '^chore: bump version to [0-9]+\.[0-9]+\.[0-9]+( \(#[0-9]+\))?$'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a version bump — skipping (gate + release will not run)"
            exit 0
          fi
          VERSION=$(echo "$SUBJECT" | sed -E 's/^chore: bump version to ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')

          # pyproject.toml must match the subject — a mismatch is a hard error,
          # not a silent skip.
          PROJECT_VER=$(grep -m1 '^version *=' pyproject.toml | awk -F'"' '{print $2}')
          if [ "$PROJECT_VER" != "$VERSION" ]; then
            echo "❌ Commit subject says $VERSION but pyproject.toml has $PROJECT_VER" >&2
            exit 1
          fi

          # Idempotency: if the tag already exists there is nothing to do.
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            echo "Tag v$VERSION already exists — skipping (idempotent)"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "✓ Detected version bump → v$VERSION (pyproject matches, tag is new)"

  # 2) The gate. Runs on the self-hosted Apple-Silicon runner (the Studio) —
  #    GitHub-hosted runners have no Metal, no weights, no agent binaries, so
  #    this is the one release check CI can't do elsewhere. Builds the EXACT
  #    source being released into a fresh venv (it isn't on PyPI yet) and
  #    re-verifies the four Tier-1 agents end-to-end. A failure here blocks the
  #    release job below. Skipped for an emergency forced release.
  #
  #    SECURITY: this self-hosted job runs only on push to the protected main
  #    branch / maintainer workflow_dispatch, never on pull_request, so fork
  #    code cannot reach the runner.
  tier1-agent-gate:
    needs: detect
    if: needs.detect.outputs.should_release == 'true' && needs.detect.outputs.force != 'true'
    runs-on: [self-hosted, macOS, rapidmlx-studio]
    # 90, not 55: the four Tier-1 agents run SERIALLY against a 35B hybrid, each
    # with retries and a per-agent budget. Worst case = claude+codex+aider at
    # 2x480s each (2880s) + hermes at 3x600s (1800s) = 4680s ~= 78 min. On a cold
    # Studio shader cache the first large-context request of each agent also pays
    # a one-time Metal-kernel compile. 55 min guillotined the run mid-agent (the
    # job was "cancelled" before any RESULT could print). The step warms kernels
    # untimed up front (hard-bounded to ~10 min) so the healthy path finishes in
    # minutes; 90 min is headroom so a slow-but-passing cold run reaches a verdict
    # instead of being killed. A genuine hang still fails on the per-agent budgets.
    # 105, not 90: the coherence golden + perf measurement now run after the
    # four agents on the same warm serve. They are minutes on a healthy run,
    # but they stack on top of the ~78 min worst case above, and a run where
    # every check PASSES near its own budget must not be guillotined.
    timeout-minutes: 105
    # Serialize with the manual agent-gate.yml so two runs never contend for the
    # single runner / the serve port.
    concurrency:
      group: tier1-agent-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Re-verify Tier-1 agents against the release source
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          # Dedicated port so we never collide with (or have to kill) another
          # rapid-mlx serve on the shared Studio; the smoke repoints agent
          # configs at it via patch_port.
          RAPID_MLX_PORT: "8188"
          # Turn on the coherence + perf extras for the REAL release path.
          # Without this the smoke skips them and this job would re-verify the
          # four agents while never checking that the flagship model still
          # answers coherently — the exact gap (#1247) that let 0.11.4 ship as
          # garbage. Coherence is fail-closed; perf stays advisory because no
          # floor is set here (RAPID_MLX_PERF_MIN_TPS unset), so it measures and
          # prints a number to review rather than inventing a baseline.
          RAPID_MLX_RELEASE_GATE: "1"
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"

          # The version being released is not on PyPI yet (publish.yml runs after
          # the tag), so build it from the checked-out source into a fresh venv.
          V="$RUNNER_TEMP/gate-venv-$VERSION"
          rm -rf "$V"
          /opt/homebrew/opt/python@3.12/bin/python3.12 -m venv "$V"
          "$V/bin/pip" install -q --upgrade pip
          "$V/bin/pip" install -q .
          echo "gate venv → $("$V/bin/rapid-mlx" --version) (releasing v$VERSION)"

          RAPID_MLX_VENV="$V" bash tests/integrations/agent_smoke.sh qwen3.6-35b-8bit
          rm -rf "$V"

  # 3) Tag + GitHub Release. Runs when the gate passed OR this is a forced
  #    (gate-bypassed) release. ``!cancelled()`` lets the ``if`` evaluate even
  #    though the gate job is skipped on a forced release. publish.yml fires on
  #    the resulting ``release: published`` event.
  release:
    needs: [detect, tier1-agent-gate]
    if: >-
      !cancelled()
      && needs.detect.result == 'success'
      && needs.detect.outputs.should_release == 'true'
      && (needs.detect.outputs.force == 'true' || needs.tier1-agent-gate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Release notes and contributor recognition need the full range from
          # the previous tag, not only the version-bump commit.
          fetch-depth: 0

      - name: Build release notes
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          FORCE: ${{ needs.detect.outputs.force }}
          ACTOR: ${{ github.actor }}
          REASON: ${{ github.event.inputs.reason }}
          EVENT_SHA: ${{ github.sha }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail

          # Resolve the commit being released ONCE, here. This SHA is what the
          # notes are generated from, what the ancestry assert checks against,
          # and (via the step output below) what the tag is created at. Nothing
          # downstream re-reads a bare ``HEAD``: two independent reads of "the
          # current commit" is exactly how notes and tag drift apart.
          RELEASE_SHA=$(git rev-parse --verify "${EVENT_SHA}^{commit}")
          HEAD_SHA=$(git rev-parse --verify 'HEAD^{commit}')
          if [ "$RELEASE_SHA" != "$HEAD_SHA" ]; then
            echo "❌ checkout is at $HEAD_SHA but the release targets $RELEASE_SHA" >&2
            echo "   (the notes would describe a different tree than the tag)" >&2
            exit 1
          fi

          # The body goes to a file, not to $GITHUB_OUTPUT. The old heredoc
          # (``body<<__EOF__``) could be escaped by any line equal to the
          # delimiter — now reachable from human-authored highlights as well as
          # commit subjects. A file has no delimiter to escape and never passes
          # through GitHub Actions expression interpolation.
          RELEASE_SHA="$RELEASE_SHA" bash scripts/build_release_notes.sh > "$NOTES_FILE"

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"
          cat "$NOTES_FILE"

      - name: Create tag and release
        env:
          # Use a user PAT (RELEASE_PAT) so the resulting ``release: published``
          # event fires downstream workflows. Releases created with the default
          # ``GITHUB_TOKEN`` are suppressed by GitHub's anti-loop guard, leaving
          # ``publish.yml`` un-triggered and the version stranded between tag and
          # PyPI/Homebrew. Falls back to ``GITHUB_TOKEN`` if the secret is absent
          # so forks don't break — the release just won't auto-publish.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.detect.outputs.version }}
          # Resolved once by the step above. The notes describe exactly this
          # commit, so the tag must be created at exactly this commit.
          RELEASE_SHA: ${{ steps.changelog.outputs.release_sha }}
          # The body lives in a file on disk; it is never interpolated into this
          # ``run:`` block, so a commit subject containing ``$(...)`` cannot
          # execute on a runner holding ``contents: write``.
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        run: |
          set -euo pipefail

          # Idempotency: re-check at create time too. An existing Release is
          # only "already done" if it points at the commit these notes
          # describe — a retry that resolved a different RELEASE_SHA must not
          # report success over a release that documents another tree.
          if EXISTING_REL=$(gh release view "$TAG" --json targetCommitish,tagName -q .targetCommitish 2>/dev/null); then
            # targetCommitish can be a branch name for pre-existing releases;
            # resolve through the tag, which is what actually ships.
            if REL_SHA=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" 2>/dev/null); then
              :
            else
              REL_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha 2>/dev/null || echo "")
            fi
            if [ -n "$REL_SHA" ] && [ "$REL_SHA" != "$RELEASE_SHA" ]; then
              echo "❌ Release $TAG already exists at $REL_SHA, but these notes describe $RELEASE_SHA." >&2
              echo "   Refusing to report success over a release that documents a different tree." >&2
              exit 1
            fi
            echo "Release $TAG already exists at the release commit ($EXISTING_REL) — done"
            exit 0
          fi

          # A tag can exist WITHOUT a Release object: a prior run that died
          # between tag and release, a hand-pushed tag, a deleted release. The
          # check above only sees Releases, so we would fall through to
          # ``gh release create`` — and GitHub REUSES an existing tag and
          # silently IGNORES ``--target``. The result is a published release
          # whose notes describe $RELEASE_SHA attached to a tag pointing
          # somewhere else. That is the one way this job can ship a release that
          # lies about its own contents, so fail loudly instead of guessing.
          # ``git fetch <tag>`` fails both when the tag is absent (fine) and
          # when the network/auth broke (NOT fine), and swallowing that with
          # ``|| true`` would read a failed check as "no tag exists" — then
          # ``gh release create`` reuses the remote tag, ignores --target, and
          # the post-condition only catches it AFTER downstream workflows fired.
          # ``ls-remote`` separates the two: exit 0 + empty means genuinely
          # absent, non-zero means we could not check and must not guess.
          if ! REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG"); then
            echo "❌ could not query origin for refs/tags/$TAG — refusing to guess." >&2
            exit 1
          fi
          if [ -n "$REMOTE_TAG" ]; then
            git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
            # ls-remote already proved the tag EXISTS, so a peel that fails
            # here is not "no tag" — it is a tag we cannot reason about (an
            # annotated tag can legally point at a tree or blob). Falling
            # through would hand it to ``gh release create``, which reuses the
            # tag and ignores --target, and the post-condition would only
            # notice after the release published and triggered downstream.
            if ! EXISTING=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
              echo "❌ Tag $TAG exists on origin but does not peel to a commit." >&2
              echo "   Refusing to publish against a tag whose target cannot be verified." >&2
              exit 1
            fi
          fi
          if [ -n "${EXISTING:-}" ]; then
            if [ "$EXISTING" != "$RELEASE_SHA" ]; then
              echo "❌ Tag $TAG already exists at $EXISTING, but these notes describe $RELEASE_SHA." >&2
              echo "   GitHub ignores --target when the tag already exists, so publishing now" >&2
              echo "   would attach these notes to a different tree." >&2
              echo "   Fix by hand: delete the stale tag, or bump to a fresh version." >&2
              exit 1
            fi
            echo "Tag $TAG already exists and points at the release commit — reusing it."
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --target "$RELEASE_SHA"

          # Post-condition: the tag that actually got published must be the
          # commit these notes were generated from.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          PUBLISHED=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [ "$PUBLISHED" != "$RELEASE_SHA" ]; then
            echo "❌ published tag $TAG points at $PUBLISHED, expected $RELEASE_SHA" >&2
            exit 1
          fi

          echo "✓ Released $TAG at $RELEASE_SHA — publish.yml will now publish to PyPI"
