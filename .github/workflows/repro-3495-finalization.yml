# ONE-OFF verification for issue #3495 (PR #3525) — not a permanent gate.
#
# We cannot reproduce the shutdown SIGSEGV locally: every machine we have
# runs macOS 26, and the crash lives in the macOS 15 dyld TLS-finalization
# pass racing native worker threads (rayon pool inside tokenizers /
# llguidance, MLX/Metal internals) during CPython interpreter
# finalization. GitHub's hosted macos-14 / macos-15 arm64 runners ARE the
# macOS 14/15 machines we don't own, so this workflow runs two experiments
# on each:
#
#   * prefix-repro  — merge-base (main, pre-#3525) code: a minimal
#     finalization probe (mlx GPU work + tokenizers batch encode to spin
#     the rayon pool, then let the interpreter finalize) in a loop, plus
#     REAL `rapid-mlx serve` runs killed with SIGINT after a streaming
#     request. Any exit 139 (SIGSEGV) or new crash report = reproduced.
#   * postfix-verify — the same two experiments on the PR head: expect
#     clean exit 0 always, zero crash reports.
#
# Results land in the job summary as an exit-code matrix; new .ips files
# files are uploaded as artifacts. Delete this file once #3495 is closed.  
name: repro-3495-finalization

on:
  workflow_dispatch:
    inputs:
      probe_runs:
        description: "Finalization-probe iterations per leg"
        required: false
        default: "15"
      serve_runs:
        description: "Real serve+SIGINT iterations per leg"
        required: false
        default: "5"

concurrency:
  group: repro-3495-finalization-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalization:
    name: "${{ matrix.os }} :: ${{ matrix.leg }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14]
        leg: [prefix-repro, postfix-verify]
    env:
      PROBE_RUNS: ${{ inputs.probe_runs || '15' }}
      SERVE_RUNS: ${{ inputs.serve_runs || '5' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "true" # let the rayon pool actually spin
    steps:
      - name: Checkout PR head (scripts + post-fix code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout merge-base into ./prefix-tree (pre-fix code)
        if: matrix.leg == 'prefix-repro'
        run: |
          git worktree add "$GITHUB_WORKSPACE/prefix-tree" origin/main
          git -C "$GITHUB_WORKSPACE/prefix-tree" log --oneline -1

      - name: Select code tree per leg
        id: tree
        run: |
          if [ "${{ matrix.leg }}" = "prefix-repro" ]; then
            echo "dir=$GITHUB_WORKSPACE/prefix-tree" >> "$GITHUB_OUTPUT"
            echo "leg=PREFIX (origin/main, pre-#3525)" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "leg=POSTFIX (PR #3525 head)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Report environment (this is the OS under test)
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          python --version

      - name: Install package
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Write finalization probe (mlx GPU + rayon pool + full finalization)
        run: |
          cat > "$RUNNER_TEMP/probe_3495.py" <<'PY'
          """#3495 minimal finalization probe.

          Mimics the post-serve teardown state: Metal pools warm, rayon
          pool warm (tokenizers batch encode), then let the interpreter
          run FULL finalization (no os._exit). A macOS dyld TLS race
          kills the process with SIGSEGV during this phase.
          """
          import sys

          import mlx.core as mx

          a = mx.random.normal((4096, 4096))
          mx.eval((a @ a.T).sum())
          mx.clear_cache()

          from tokenizers import Tokenizer

          tok = Tokenizer.from_pretrained("gpt2")
          # batch encode so rayon workers actually spawn
          tok.encode_batch([f"warm the rayon pool {i}" for i in range(64)])
          del tok

          print("probe: reaching finalization", file=sys.stderr)
          PY

      - name: Run finalization probe loop
        id: probe
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          RESULTS="$RUNNER_TEMP/results/probe.txt"
          : > "$RESULTS"
          CRASHES_BEFORE=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | wc -l | tr -d ' ')
          for i in $(seq 1 "$PROBE_RUNS"); do
            python "$RUNNER_TEMP/probe_3495.py" > /dev/null 2>&1
            STATUS=$?
            echo "probe_run_$i=$STATUS" | tee -a "$RESULTS"
          done
          CRASHES_AFTER=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | wc -l | tr -d ' ')
          echo "crash_reports_before=$CRASHES_BEFORE" | tee -a "$RESULTS"
          echo "crash_reports_after=$CRASHES_AFTER" | tee -a "$RESULTS"
          SEGV=$(grep -c "=139$" "$RESULTS" || true)
          CRASH_NEW=$((CRASHES_AFTER - CRASHES_BEFORE))
          {
            echo "segv_count=$SEGV"
            echo "new_crash_reports=$CRASH_NEW"
          } | tee -a "$RESULTS"
          if [ "$SEGV" -gt 0 ] || [ "$CRASH_NEW" -gt 0 ]; then
            echo "PROBE_REPRODUCED=yes" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Real serve + streaming request + SIGINT loop
        id: serve
        run: |
          RESULTS="$RUNNER_TEMP/results/serve.txt"
          : > "$RESULTS"
          CRASHES_BEFORE=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | wc -l | tr -d ' ')
          cat > "$RUNNER_TEMP/serve_sigint.sh" <<'SH'
          #!/bin/bash
          # one serve lifecycle: boot -> one streaming completion -> SIGINT
          PORT=$((9500 + RANDOM % 400))
          set -m
          rapid-mlx serve mlx-community/Qwen3-0.6B-4bit --port "$PORT" \
            > "$RUNNER_TEMP/serve_run.log" 2>&1 &
          PID=$!
          for i in $(seq 1 240); do
            curl -s -o /dev/null "http://127.0.0.1:$PORT/health" && break
            kill -0 "$PID" 2>/dev/null || { echo "died-during-startup"; exit 98; }
            sleep 2
          done
          curl -s "http://127.0.0.1:$PORT/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"model":"mlx-community/Qwen3-0.6B-4bit","stream":true,"messages":[{"role":"user","content":"hi"}],"max_tokens":10}' \
            > /dev/null
          sleep 1
          kill -INT "$PID"
          for i in $(seq 1 60); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID"; echo "timeout"
            exit 99
          fi
          wait "$PID"
          echo "exit_status=$?"
          SH
          chmod +x "$RUNNER_TEMP/serve_sigint.sh"
          cd "${{ steps.tree.outputs.dir }}"
          for i in $(seq 1 "$SERVE_RUNS"); do
            "$RUNNER_TEMP/serve_sigint.sh" 2>&1 | tail -1 | sed "s/^/serve_run_$i=/"
          done | tee -a "$RESULTS"
          CRASHES_AFTER=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | wc -l | tr -d ' ')
          echo "crash_reports_before=$CRASHES_BEFORE" | tee -a "$RESULTS"
          echo "crash_reports_after=$CRASHES_AFTER" | tee -a "$RESULTS"
          SEGV=$(grep -c "exit_status=139" "$RESULTS" || true)
          CRASH_NEW=$((CRASHES_AFTER - CRASHES_BEFORE))
          {
            echo "segv_count=$SEGV"
            echo "new_crash_reports=$CRASH_NEW"
          } | tee -a "$RESULTS"
          if [ "$SEGV" -gt 0 ] || [ "$CRASH_NEW" -gt 0 ]; then
            echo "SERVE_REPRODUCED=yes" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tally leg result
        run: |
          echo "## ${{ matrix.os }} :: ${{ steps.tree.outputs.leg }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/results/probe.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/results/serve.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload new crash reports (if any)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crash-reports-${{ matrix.os }}-${{ matrix.leg }}
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: results-${{ matrix.os }}-${{ matrix.leg }}
          path: ${{ runner.temp }}/results/
          retention-days: 7
