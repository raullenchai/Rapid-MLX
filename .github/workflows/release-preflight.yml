name: Release pre-flight

# Runs SOP gates that block a release if they fail. Triggered on PRs
# whose title is the canonical bump subject ``chore: bump version to
# X.Y.Z`` (strict, no ``(#NN)`` suffix). The post-merge detect step in
# auto-release.yml is deliberately MORE tolerant — it accepts the
# ``(#NN)`` squash suffix via ``release_version.py subject
# --allow-pr-suffix`` — so pre-merge strictness here is title hygiene,
# not the gate that decides whether a merged commit auto-releases.
#
# Gate coverage (see docs/development/releasing.md for the canonical list):
#
#   G1   clean-room install + import smoke     macOS-14
#   G2   codex review presence assertion       advisory comment
#   G3   CLI ↔ Config fidelity audit           covered by ci.yml lint
#   G10  MLX upstream cross-chip-family scan   advisory
#   G11  auto-routing escape-hatch registry    macOS-14 (needs MLX)
#   PF-1 canonical bump-PR title pre-check     ubuntu-latest
#   PF-2 release secret + var presence         ubuntu-latest
#        + Cloudflare credential probe (expiry blocks; scope gaps advise)
#
# What this workflow does NOT cover (M3-only, runs locally — see
# releasing.md):
#   G4 full make smoke (covered by ci.yml test-apple-silicon subset)
#   G5 make stress      — needs cached weights + live server
#   G6 fix-path repro   — needs live server
#   G7 SDK integration  — needs cached weights + network
#   G8 microbench       — needs perf-baseline infra (#TBD)
#   G9 latency 10-seq   — needs live server

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-bump-pr:
    runs-on: ubuntu-latest
    outputs:
      is_bump: ${{ steps.check.outputs.is_bump }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Deliberately BROADER than PF-1: detect the optional ``(#NN)`` squash
          # suffix so a suffixed bump title is still routed INTO the gates (PF-1
          # then runs and fails it, keeping the title canonical). This mirrors
          # the post-merge detect step in auto-release.yml, which also uses
          # --allow-pr-suffix. Non-bump PRs pay zero CI cost.
          if VERSION=$(python3 scripts/release_version.py subject --allow-pr-suffix "$TITLE"); then
            echo "is_bump=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Detected bump PR for v$VERSION"
          else
            echo "is_bump=false" >> "$GITHUB_OUTPUT"
            echo "Not a bump PR — skipping all preflight gates"
          fi

  pf1-subject-regex:
    # PF-1 — keeps the bump-PR title CANONICAL. detect-bump-pr already routed any
    # (canonical or `(#NN)`-suffixed) bump title here; PF-1 now requires the strict
    # canonical subject and FAILS a suffixed one. The post-merge detect step in
    # auto-release.yml is separately suffix-TOLERANT (--allow-pr-suffix), so this
    # strictness is title hygiene, not what decides whether a merged commit
    # auto-releases. Pure structural; runs on every bump PR opened/edited.
    needs: detect-bump-pr
    if: needs.detect-bump-pr.outputs.is_bump == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: PF-1 — validate bump PR title matches auto-release regex
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/validate_release_subject.py --subject "$TITLE"
      - name: Verify pyproject.toml version matches title
        env:
          TITLE_VER: ${{ needs.detect-bump-pr.outputs.version }}
        run: |
          PYPROJECT_VER=$(grep -m1 '^version *=' pyproject.toml | awk -F'"' '{print $2}')
          echo "title: $TITLE_VER"
          echo "pyproject.toml: $PYPROJECT_VER"
          if [ "$TITLE_VER" != "$PYPROJECT_VER" ]; then
            echo "::error::PR title says v$TITLE_VER but pyproject.toml is $PYPROJECT_VER. Bump pyproject.toml or rename the PR."
            exit 1
          fi

  pf2-release-secrets:
    # PF-2 — every secret and var that rapid-mac-release.yml references must
    # already be configured. Actions evaluates a missing secret to the empty
    # string rather than erroring, so the gap surfaces only on the tag, after
    # the notarised build, with the GitHub Release already published (#1851).
    # Checking on the bump PR moves that discovery before the tag exists.
    #
    # Skipped on fork PRs: Actions withholds secrets from them by design, so
    # an empty context there would fail every name without proving anything.
    needs: detect-bump-pr
    if: >-
      needs.detect-bump-pr.outputs.is_bump == 'true' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml
      - name: PF-2 — release workflow secrets and vars are configured
        env:
          # Actions exposes no way to enumerate configured names, so the whole
          # context is passed as JSON. The script reads KEYS only and never
          # prints a value.
          AVAILABLE_SECRETS_JSON: ${{ toJSON(secrets) }}
          AVAILABLE_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          # Scan the tagged publishing lane AND the shared desktop-releasable
          # composite action, so a secret the pre-tag candidate gate needs is
          # discovered on the bump PR, not after a notarised build (#2301).
          python scripts/check_release_secrets.py \
            .github/workflows/rapid-mac-release.yml \
            .github/actions/desktop-releasable/action.yml

      - name: PF-2 — release credentials are usable, not just present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Read into the environment rather than interpolated into the shell,
          # so a repository-variable value can never be parsed as script.
          R2_BUCKET: ${{ vars.RAPID_MAC_DIST_R2_BUCKET }}
        run: |
          python scripts/probe_release_credentials.py --bucket "$R2_BUCKET"

  pf3-tag-environment:
    # PF-3 — reads back the ACTUAL production tag environment (rapid-mac-tag)
    # and fails closed if it is missing or unprotected. A workflow reference to
    # an environment auto-creates an UNPROTECTED one, so code comments are not
    # an approval gate by themselves (#2301, release-setting finding): the
    # environment must already exist with a required-reviewer rule, and its
    # deployment-branch policy must be exactly ``main``, or nothing may tag.
    # This read-back makes future deletion/drift a preflight NO-GO rather than a
    # silent unprotected-approval path. can_admins_bypass must be exactly false
    # (GitHub supports disabling it) so an RC claim can never ride an admin who
    # could approve without a required reviewer; missing or true fails closed.
    needs: detect-bump-pr
    if: needs.detect-bump-pr.outputs.is_bump == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PF-3 — read back rapid-mac-tag environment protection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ENV_NAME="rapid-mac-tag"

          # Fetch the RAW JSON responses into files. The environment MUST already
          # exist explicitly — ``gh api`` exits non-zero when it does not, and a
          # missing environment is a hard fail, never a chance to silently
          # auto-create an unprotected one.
          gh api "repos/${REPO}/environments/${ENV_NAME}" \
            > "$RUNNER_TEMP/pf3-env.json" || {
            echo "::error::production tag environment '${ENV_NAME}' is missing. The auto-release workflow references it and would auto-create an UNPROTECTED environment, which is not an approval gate. Create it with a required-reviewer rule (reviewer raullenchai) and a deployment-branch policy of exactly 'main' before any RC can be tagged." >&2
            exit 1
          }
          # The deployment-branch-policies endpoint is PLURAL and its response is
          # {"total_count": N, "branch_policies": [...]}.
          gh api "repos/${REPO}/environments/${ENV_NAME}/deployment-branch-policies" \
            > "$RUNNER_TEMP/pf3-policy.json" || {
            echo "::error::cannot read the deployment-branch policy for '${ENV_NAME}'; treating as NO-GO." >&2
            exit 1
          }

          # Evaluate the structured JSON offline (no text/regex). check_release_
          # environment.py is unit-tested with mocked responses so the contract
          # is pinned: exactly one required_reviewers rule, reviewer login exactly
          # raullenchai, prevent_self_review=false, exactly one branch policy
          # {name: main, type: branch}, and can_admins_bypass exactly false
          # (admin bypass must be disabled; true or missing fails closed).
          python3 scripts/check_release_environment.py \
            --environment-json "$RUNNER_TEMP/pf3-env.json" \
            --policy-json "$RUNNER_TEMP/pf3-policy.json" \
            --expected-env-name "$ENV_NAME" \
            | tee "$GITHUB_STEP_SUMMARY"
          echo "PF3_OK=1"

  g1-release-smoke:
    # G1 — clean-room install + import smoke on macOS-14. Catches the
    # #408 class where dev mlx has a symbol PyPI mlx doesn't.
    needs: detect-bump-pr
    if: needs.detect-bump-pr.outputs.is_bump == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: G1 — build once and smoke the exact release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*
          python scripts/release_smoke.py --dist-dir dist

  g10-upstream-mlx-scan:
    # G10 — advisory scan of installed mlx-lm/mlx-vlm for module-scope
    # calls into chip-family-sensitive APIs. Surfaces, does not block.
    # The release-er must cite "audited" in the PR description if any
    # finding lands in a code path our compat shim doesn't already cover.
    needs: detect-bump-pr
    if: needs.detect-bump-pr.outputs.is_bump == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install mlx-lm + mlx-vlm at pyproject-pinned versions
        # The scan must run against the EXACT version range the bump
        # ships. Install in user-site so we don't disturb the runner's
        # default python.
        run: |
          python -m pip install --upgrade pip
          # Install only mlx-* (skip the rest — we just need the wheel
          # tree on disk to scan).
          MLX_LM_PIN=$(grep -m1 'mlx-lm' pyproject.toml | grep -oE '>=[0-9.]+|==[0-9.]+|~=[0-9.]+' | head -1 || true)
          MLX_VLM_PIN=$(grep -m1 'mlx-vlm' pyproject.toml | grep -oE '>=[0-9.]+|==[0-9.]+|~=[0-9.]+' | head -1 || true)
          pip install "mlx-lm${MLX_LM_PIN}" "mlx-vlm${MLX_VLM_PIN}"
      - name: G10 — surface module-scope dangerous MLX calls
        # Advisory only (no --strict). The release reviewer reads the
        # output and decides whether each finding needs a compat shim.
        run: python scripts/check_mlx_upstream_calls.py

  g11-escape-hatch:
    # G11 — auto-routing escape-hatch registry. Catches the class of
    # bugs in #393 (no --no-mllm), #400 (silent flag drop), #404 (no
    # user override for hardware probe). Requires MLX because the test
    # introspects vllm_mlx.engine / vllm_mlx.server signatures.
    needs: detect-bump-pr
    if: needs.detect-bump-pr.outputs.is_bump == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project (vision extras for full surface coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vision]"
          pip install pytest pytest-asyncio
      - name: G11 — escape-hatch registry test
        run: pytest tests/test_no_mllm_flag.py -v --tb=short

  preflight-summary:
    # Roll-up so the bump PR has a single "Release pre-flight" required
    # check to gate merge on, instead of N independent jobs.
    needs:
      - detect-bump-pr
      - pf1-subject-regex
      - pf2-release-secrets
      - pf3-tag-environment
      - g1-release-smoke
      - g10-upstream-mlx-scan
      - g11-escape-hatch
    if: always() && needs.detect-bump-pr.outputs.is_bump == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate gate results
        env:
          PF1: ${{ needs.pf1-subject-regex.result }}
          PF2: ${{ needs.pf2-release-secrets.result }}
          PF3: ${{ needs.pf3-tag-environment.result }}
          G1: ${{ needs.g1-release-smoke.result }}
          G10: ${{ needs.g10-upstream-mlx-scan.result }}
          G11: ${{ needs.g11-escape-hatch.result }}
        run: |
          echo "PF-1 subject regex:   $PF1"
          echo "PF-2 release secrets: $PF2  (skipped on fork PRs)"
          echo "PF-3 tag environment: $PF3"
          echo "G1   release-smoke:   $G1"
          echo "G10  upstream MLX:    $G10  (advisory — never fails)"
          echo "G11  escape-hatch:    $G11"
          # G10 is advisory — never blocks. Others must pass. PF-2 is allowed
          # to be "skipped" because a fork PR cannot see secrets at all; every
          # other skip path is already excluded by the is_bump guard above.
          if [ "$PF2" != "success" ] && [ "$PF2" != "skipped" ]; then
            echo "::error::PF-2 failed: the release workflow references a secret or var that is not configured. A release cut now would fail on the tag with the release already published (#1851)."
            exit 1
          fi
          if [ "$PF3" != "success" ]; then
            echo "::error::PF-3 failed: the rapid-mac-tag environment is missing or no longer protected. A tag claim would not be human-authorized (#2301). Recreate it with a required reviewer and a main-only deployment policy, then re-run."
            exit 1
          fi
          if [ "$PF1" != "success" ] || [ "$G1" != "success" ] || [ "$G11" != "success" ]; then
            echo "::error::One or more release pre-flight gates failed. See docs/development/releasing.md for the gate definitions."
            exit 1
          fi
          echo "All blocking gates passed. M3-only gates (G4-G9) must be run locally."
