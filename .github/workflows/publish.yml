name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package (retry on magic-byte collision)
        # PyPI's _is_valid_dist_file rejects any file where both
        # zipfile.is_zipfile() and tarfile.is_tarfile() return True
        # (https://github.com/pypi/warehouse/blob/main/warehouse/forklift/legacy.py).
        # Compressed output is non-deterministic; ~rare rebuilds emit
        # bytes that coincidentally match the other format's magic.
        # We rebuild up to 5 times until neither artifact collides.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf dist/ build/
            python -m build
            if python3 -c "
          import glob, sys, tarfile, zipfile
          ok = True
          for f in sorted(glob.glob('dist/*')):
              z = zipfile.is_zipfile(f); t = tarfile.is_tarfile(f)
              print(f'  {f}: zip={z} tar={t}')
              if z and t: ok = False
          sys.exit(0 if ok else 2)
          "; then
              echo "Build attempt $attempt: clean (no PyPI magic-byte collision)"
              exit 0
            fi
            echo "Build attempt $attempt: magic-byte collision detected, rebuilding..."
          done
          echo "ERROR: 5 builds in a row hit PyPI's zip+tar collision check"
          exit 1

      - name: Validate distribution metadata and create release manifest
        run: |
          twine check dist/*
          SOURCE_SHA="$(git rev-parse HEAD)"
          python scripts/release_manifest.py create \
            --dist-dir dist \
            --output release-manifest.json \
            --source-sha "$SOURCE_SHA" \
            --version "${GITHUB_REF_NAME#v}"
          cat release-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-candidate
          path: |
            dist/
            release-manifest.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # contents: read is required for the tag re-resolution step's
      # authenticated `gh api` call below.
      contents: read
    outputs:
      sdist_sha256: ${{ steps.verify-manifest.outputs.sdist_sha256 }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-candidate
          path: candidate/

      - name: Verify release artifact manifest
        id: verify-manifest
        # Do this inline and with stdlib only. The publishing job must not
        # execute a script from the candidate artifact before it receives its
        # PyPI OIDC token.
        env:
          EXPECTED_VERSION: ${{ github.event.release.tag_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("candidate/release-manifest.json").read_text())
          version = os.environ["EXPECTED_VERSION"].removeprefix("v")
          if manifest.get("schema") != 1 or manifest.get("project") != "rapid-mlx":
              raise SystemExit("invalid release manifest schema/project")
          if manifest.get("version") != version:
              raise SystemExit(
                  f"manifest version {manifest.get('version')!r} does not match tag {version!r}"
              )
          if manifest.get("source_sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("manifest source SHA does not match the release target")

          artifacts = {item["filename"]: item for item in manifest.get("artifacts", [])}
          dist = Path("candidate/dist")
          files = sorted(path for path in dist.iterdir() if path.is_file())
          if len(artifacts) != 2:
              raise SystemExit("manifest must contain exactly two artifacts")
          if set(artifacts) != {path.name for path in files}:
              raise SystemExit("manifest artifact names do not match candidate dist/")
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              item = artifacts[path.name]
              if item.get("sha256") != digest or item.get("size") != path.stat().st_size:
                  raise SystemExit(f"manifest digest/size mismatch for {path.name}")
          wheels = [name for name in artifacts if name.endswith(".whl")]
          if len(wheels) != 1:
              raise SystemExit("manifest must contain exactly one wheel")
          sdists = [name for name in artifacts if name.endswith(".tar.gz")]
          if len(sdists) != 1:
              raise SystemExit("manifest must contain exactly one sdist")
          if not wheels[0].startswith(f"rapid_mlx-{version}-"):
              raise SystemExit("wheel filename does not match the release tag")
          if sdists[0] != f"rapid_mlx-{version}.tar.gz":
              raise SystemExit("sdist filename does not match the release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sdist_sha256={artifacts[sdists[0]]['sha256']}\n")
          print("release manifest verified")
          PY

      - name: Re-resolve the tag and require it still points at the manifest SHA
        # TOCTOU guard: this job trusts the frozen ``github.sha`` from the
        # `release: published` event, but a tag force-moved or recreated after
        # the event fired would let PyPI receive artifacts built from a
        # different commit than the tag now identifies. Re-resolve
        # refs/tags/$GITHUB_REF_NAME (dereferencing annotated tags) right
        # before the credential and require it to equal the manifest SHA.
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            --jq '.object.sha')
          TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            --jq '.object.type')
          if [ "$TYPE" = "tag" ]; then
            REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REF}" \
              --jq '.object.sha')
          fi
          if [ "$REF" != "$EXPECTED_SHA" ]; then
            echo "Tag ${TAG} now points at ${REF}, not the manifest SHA ${EXPECTED_SHA}; refusing to publish" >&2
            exit 1
          fi
          echo "Tag ${TAG} still resolves to the manifest SHA ${EXPECTED_SHA}"

      - name: Publish to PyPI
        # Duplicate files fail loudly. A retry must consume the same
        # manifest-verified candidate, never silently accept a potentially
        # different rebuild of the same immutable PyPI version.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: candidate/dist/

  installer-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create installer checksums
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Version-stamp the manifest so each release signs UNIQUE content.
          # install.sh is stable across releases, so a version-independent
          # SHA256SUMS.txt yields a byte-identical blob every time; cosign
          # keyless signatures are deterministic, so Rekor rejects the
          # duplicate transparency-log entry with a 409 "equivalent entry
          # already exists" and the signing step fails (#1434). A per-release
          # header line makes the signed blob unique, so Rekor always gets a
          # fresh entry. The header is a `#` comment line, which both GNU
          # `sha256sum -c` (incl. --strict) and BSD `shasum -c` skip, so
          # `install.sh` verification is unaffected. TAG comes via env (not
          # inline GitHub Actions expression interpolation) to avoid script
          # injection.
          {
            printf '# Rapid-MLX %s installer checksums\n' "$TAG"
            sha256sum install.sh
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless, GitHub OIDC)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -o pipefail
          # The version-stamped manifest above makes the normal path 409-free,
          # so cosign signs and writes the bundle as usual. Belt-and-suspenders
          # for a re-published tag (identical content signed twice): tolerate
          # ONLY the benign Rekor 409. But a 409 alone does NOT prove a usable
          # signature is published — an earlier run could have created the
          # transparency-log entry and then died before writing/uploading the
          # bundle. So on a 409, require that the release already carries a
          # bundle that cryptographically verifies against the current
          # SHA256SUMS.txt; otherwise fail rather than publish unsigned
          # checksums. Any other cosign failure also fails the job.
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if cosign sign-blob --yes SHA256SUMS.txt \
              --bundle SHA256SUMS.txt.sigstore.json 2>&1 | tee "$log"; then
            echo "signed SHA256SUMS.txt"
          elif grep -q '409' "$log" \
              && grep -qi 'equivalent entry already exists' "$log"; then
            echo "::notice::cosign 409 (equivalent Rekor entry already exists) —" \
              "re-published tag; validating the bundle already on the release"
            rm -f SHA256SUMS.txt.sigstore.json
            if ! gh release download "$TAG" \
                --pattern SHA256SUMS.txt.sigstore.json --dir .; then
              echo "::error::Rekor 409 but the release has no signature bundle" \
                "to fall back on — refusing to publish unsigned checksums" >&2
              exit 1
            fi
            # Pin the exact keyless identity — THIS publish workflow at THIS
            # tag — not a repo-wide regexp, so the fallback cannot bless a
            # bundle signed by any other workflow or ref. Exact match (not a
            # regexp) also sidesteps escaping TAG. Worst case if the SAN
            # differs is a fail-closed job on a rare re-publish, never a
            # loosened check.
            if ! cosign verify-blob SHA256SUMS.txt \
                --bundle SHA256SUMS.txt.sigstore.json \
                --certificate-identity \
                  "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${TAG}" \
                --certificate-oidc-issuer \
                  "https://token.actions.githubusercontent.com"; then
              echo "::error::existing release bundle does not verify against the" \
                "current SHA256SUMS.txt — refusing to publish unsigned checksums" >&2
              exit 1
            fi
            echo "::notice::existing release bundle verifies; keeping it"
          else
            echo "::error::cosign sign-blob failed for a reason other than a" \
              "benign Rekor 409" >&2
            exit 1
          fi

      - name: Upload installer assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The sign step guarantees a local bundle whenever the job reaches
          # here: either freshly signed, or (on a tolerated 409 re-run)
          # downloaded from the release and cryptographically verified. If it
          # is somehow absent, fail rather than publish checksums without a
          # signature — the signed-release guarantee is not optional.
          if [ ! -f SHA256SUMS.txt.sigstore.json ]; then
            echo "::error::no signature bundle present at upload — refusing to" \
              "publish checksums without a signature" >&2
            exit 1
          fi
          gh release upload "$TAG" \
            install.sh SHA256SUMS.txt SHA256SUMS.txt.sigstore.json \
            --clobber
