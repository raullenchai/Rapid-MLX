name: Tier-1 agent gate

# Re-verifies the five Tier-1 (flagship) agents — Claude Code, Codex, Hermes,
# Aider, DeepSeek Harness — end-to-end against a real local model on Apple
# Silicon, then reuses the
# same warm serve to run the deep output-coherence golden (#1247) and a
# decode-throughput perf check. This is the one release check GitHub-hosted
# runners structurally cannot do (no Metal, no weights, no agent binaries), so it
# runs on a self-hosted Apple-Silicon runner (the Studio). Mirrors how Apple's own
# MLX gates its Metal tests on `[self-hosted, macos]`.
#
# The coherence + perf extras are driven by RAPID_MLX_RELEASE_GATE=1 (set below)
# and land in agent_smoke.sh so they share the one 35B load — catching the
# "agentic path works but the model outputs garbage / regressed in speed" class
# that agentic checks alone missed (0.11.4).
#
# Phase 1: manual (`workflow_dispatch`) only, so we can prove the runner + smoke
# work before wiring it into the release path. Phase 2 will add this as a
# `needs:` gate in auto-release.yml so a version bump cannot tag/publish unless
# it passes.
#
# SECURITY: this targets a self-hosted runner, so it must NEVER be triggered by
# `pull_request` (fork code must not touch self-hosted hardware). Keep the
# triggers to `workflow_dispatch` and, later, `push`/release on the trusted
# main branch only.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model alias to verify against (>=8-bit; never 4-bit)"
        default: "qwen3.6-35b-8bit"
      perf_min_tps:
        description: "Optional reviewed decode tok/s floor for the perf gate. Blank = advisory (measure + print the number to review, never fails)."
        default: ""

permissions:
  contents: read

concurrency:
  # One agent-gate run at a time — it boots a large model and drives real
  # agents; overlapping runs would contend for the Studio's RAM and port 8000.
  group: tier1-agent-gate
  cancel-in-progress: false

jobs:
  tier1-smoke:
    runs-on: [self-hosted, macOS, rapidmlx-studio]
    # Headroom above the script's own worst case so the smoke exits on its own,
    # prints its summary, and runs cleanup — instead of GitHub cancelling
    # mid-run. A passing run finishes in ~5-8 min; the tail only matters on
    # regressions.
    # Raised from 55: the release path now adds the coherence golden and a
    # perf measurement on top of the agents (all on the same warm
    # serve). Each check is individually bounded, but they stack, and a
    # run where every check PASSES near its own limit could otherwise be
    # cancelled by Actions for exceeding the job budget.
    #
    # Raised from 75: DeepSeek Harness is the fifth Tier-1 agent.
    #
    # This job and auto-release.yml's tier1-agent-gate run the SAME
    # agent_smoke.sh, so they must not quote different worst cases. The one
    # arithmetic, from the script's own budgets (AGENT_TO=480 x2 attempts for
    # claude/codex/aider/dsh, HERMES_TO=600 x3 for hermes):
    #   four agents  3x960 + 1800 = 4680s ~= 78 min
    #   five agents  4x960 + 1800 = 5640s ~= 94 min
    # An earlier revision of this comment claimed ~42 min for the four-agent
    # tail; that predated the 35B gate model and the 600s hermes budget and was
    # simply stale. Do not reintroduce it — recompute from AGENT_TO/HERMES_TO.
    #
    # 90 rather than auto-release's 125 because this manual job does NOT run
    # the release-gate extras (coherence golden + perf) — those are gated on
    # RAPID_MLX_RELEASE_GATE=1, which only the release path sets. 94 min of
    # pathological-retry tail still exceeds 90, but that path requires every
    # agent to burn every retry; a genuine hang fails on its own per-agent
    # budget long before, and this job is operator-triggered rather than
    # release-blocking, so the tighter cap is the deliberate trade.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Tier-1 agent re-verification
        env:
          # The isolated audit venv on the Studio (python@3.12, pinned rapid-mlx).
          # Phase 2 will (re)create this at the release version before the gate.
          RAPID_MLX_VENV: /Users/raullenstudio/rapid-mlx-audit-venv
          # Untrusted-ish input passed via env, never interpolated into the
          # script line (matches the repo's auto-release.yml convention).
          MODEL: ${{ inputs.model }}
          # Turn on the release-gate extras in agent_smoke.sh: after the four
          # agents pass, reuse the SAME warm serve to run the deep coherence
          # golden (#1247) and a decode-throughput perf check — no second load.
          RAPID_MLX_RELEASE_GATE: "1"
          # Reviewed perf floor (tok/s). Blank → perf runs advisory (prints the
          # number to review); set it here to enforce. Never a fabricated baseline.
          RAPID_MLX_PERF_MIN_TPS: ${{ inputs.perf_min_tps }}
        run: bash tests/integrations/agent_smoke.sh "$MODEL"
