name: CI

on:
  push:
    branches: [main, release/0.16.0]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job in this workflow runs product code (engine, CLI, Desktop app) on
# shared or self-hosted machines. None of that is a user: keep it out of the
# production telemetry store. The engine and the Desktop app both honour this
# kill switch; the golden-flow harness lifts it only for the flows that turn
# telemetry on against a loopback sink (fresh-install, fresh-install-share,
# no-dead-controls). The Desktop unit tests pin their own environment, so the
# switch stays on while they run.
env:
  RAPID_MLX_TELEMETRY: "0"

# Linux runner routing (JSON runner specs: a string or a label array; unset uses ubuntu-latest):
# - CI_LINUX_RUNNER routes the heavy test-matrix shards.
# - CI_LINUX_LIGHT_RUNNER routes every other (seconds-long) Linux job, so
#   control-plane work never queues behind test shards on a small pool.
# Fork heads (pull_request, pull_request_target, workflow_run) always use ubuntu-latest.
# Rollback: gh variable delete CI_LINUX_RUNNER (heavy); gh variable delete CI_LINUX_LIGHT_RUNNER (light)

jobs:
  changes:
    permissions:
      contents: read
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    outputs:
      engine: ${{ steps.policy.outputs.engine }}
      desktop: ${{ steps.policy.outputs.desktop }}
      docs_only: ${{ steps.policy.outputs.docs_only }}
      full_gate: ${{ steps.policy.outputs.full_gate }}
      l1_matrix: ${{ steps.policy.outputs.l1_matrix }}
      linux_matrix_mode: ${{ steps.policy.outputs.linux_matrix_mode }}
      linux_matrix_reason: ${{ steps.policy.outputs.linux_matrix_reason }}
      test_matrix: ${{ steps.policy.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify validation lanes
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Classify the actual diff before integration promotion. Promotion
            # broadens coverage inside the affected lane; it must not turn an
            # engine-only PR into a full Desktop run (or vice versa).
            # Disable rename folding so both the removed source path and the
            # new destination participate in classification.
            git diff --no-renames --name-only "$PR_BASE_SHA" "$GITHUB_SHA" > /tmp/changed-paths
            full_gate=false
            if [ "$HEAD_REPO" = "$REPO" ] && \
              [[ "$HEAD_REF" == train/* ]]; then
              full_gate=true
            fi
            echo "full_gate=$full_gate" >> "$GITHUB_OUTPUT"
            if [ "$full_gate" = true ]; then
              python scripts/classify_ci_changes.py \
                --paths-file /tmp/changed-paths \
                --force-full \
                --force-reason promoted-head \
                --github-output "$GITHUB_OUTPUT"
              echo 'l1_matrix={"include":[{"model":"qwen3.5-4b-4bit","contract_only":"0"},{"model":"llama3-3b-4bit","contract_only":"0"},{"model":"gemma3-4b-qat-4bit","contract_only":"1"},{"model":"qwen3-4b-instruct-2507-4bit","contract_only":"1"},{"model":"qwen3-4b-thinking-2507-4bit","contract_only":"1"}]}' >> "$GITHUB_OUTPUT"
            else
              python scripts/classify_ci_changes.py \
                --paths-file /tmp/changed-paths \
                --github-output "$GITHUB_OUTPUT"
              echo 'l1_matrix={"include":[{"model":"qwen3.5-4b-4bit","contract_only":"0"}]}' >> "$GITHUB_OUTPUT"
            fi
          else
            # Non-PR events run the complete engine gate.
            {
              echo 'engine=true'
              echo 'desktop=true'
              echo 'docs_only=false'
              echo 'full_gate=true'
              echo 'linux_matrix_mode=full'
              echo 'linux_matrix_reason=non-pr-full'
              echo 'test_matrix={"include":[{"python-version":"3.10","shard":1},{"python-version":"3.10","shard":2},{"python-version":"3.10","shard":3},{"python-version":"3.11","shard":1},{"python-version":"3.11","shard":2},{"python-version":"3.11","shard":3},{"python-version":"3.12","shard":1},{"python-version":"3.12","shard":2},{"python-version":"3.12","shard":3}]}'
              echo 'l1_matrix={"include":[{"model":"qwen3.5-4b-4bit","contract_only":"0"},{"model":"llama3-3b-4bit","contract_only":"0"},{"model":"gemma3-4b-qat-4bit","contract_only":"1"},{"model":"qwen3-4b-instruct-2507-4bit","contract_only":"1"},{"model":"qwen3-4b-thinking-2507-4bit","contract_only":"1"}]}'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Explain Linux matrix route
        env:
          MATRIX_MODE: ${{ steps.policy.outputs.linux_matrix_mode }}
          MATRIX_REASON: ${{ steps.policy.outputs.linux_matrix_reason }}
        run: |
          echo "Linux matrix: ${MATRIX_MODE} (${MATRIX_REASON})"
          {
            echo '### Linux test matrix'
            echo "- Mode: \`${MATRIX_MODE}\`"
            echo "- Reason: \`${MATRIX_REASON}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-lane-no-mac:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine != 'true' &&
      needs.changes.outputs.desktop != 'true'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Mark no-Mac merge lane
        run: echo "This head requires neither the engine nor Desktop lane."

  merge-lane-mac:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.engine == 'true' ||
       needs.changes.outputs.desktop == 'true')
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Mark Mac-required merge lane
        run: echo "This head requires the engine, Desktop, or both lanes."

  lint:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyyaml: check_gha_pinning.py parses workflow YAML (so quoted
          # `uses` forms cannot bypass the SHA-pin gate).
          pip install ruff pyyaml

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      # PF-3 — all GitHub Actions are immutable 40-char commit SHA pins.
      # Dependabot or a reviewed PR is required to advance an action.
      - name: GitHub Actions SHA pinning
        run: python scripts/check_gha_pinning.py

      # An invalid ``${{ … }}`` expression invalidates the WHOLE workflow:
      # the run fails instantly with zero jobs and no log, and because it
      # is not a PR check it never shows up as red on the PR that
      # introduced it. That is how an empty expression inside a `run:`
      # comment took the release pipeline down for a full day.
      - name: Workflow expression sanity
        run: python scripts/check_workflow_expressions.py

      # The model-management diagram and status tables are generated from one
      # reviewed YAML manifest. Fail if a PR edits status/relationships without
      # regenerating the GitHub-facing Mermaid/SVG views.
      - name: Model-management architecture SSOT
        run: python scripts/render_model_management_architecture.py --check

      # The engine and the desktop app ship ONE version number. Keep this
      # universal because either side of that cross-product contract can change.
      - name: Engine ↔ desktop app version sync
        run: python scripts/check_version_sync.py

  engine-contracts:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine == 'true'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Structural check — catches "silent flag drop" bugs where a CLI
      # arg is defined but never plumbed to its target config (#400).
      # Pure stdlib + AST — no mlx import required, runs on Linux.
      - name: CLI ↔ Config fidelity audit
        run: python scripts/audit_cli_config_fidelity.py

      # The release scripts cannot be exercised without cutting a release, so
      # their tag-claim, recovery and refuse-to-move paths are covered offline
      # against a mock ``gh``. These existed but nothing ran them, which is how
      # a release-path regression stays invisible until release day. Pure bash,
      # no network/gh/git.
      - name: Release-script offline tests
        run: |
          set -euo pipefail
          for t in tests/release/test_*.sh; do
            echo "── $t"
            bash "$t"
          done

      # install.sh picks the interpreter and builds ~/.rapid-mlx, but it only
      # runs end-to-end on Apple Silicon, so its arch-selection and venv-repair
      # logic (see #1953) is covered offline against fake interpreters. Pure
      # bash, no network/Python/real install — runs on the Linux CI leg.
      - name: Installer offline tests
        run: |
          set -euo pipefail
          for t in tests/install/test_*.sh; do
            echo "── $t"
            bash "$t"
          done

      # Parser microbench — reports order-of-magnitude (>12x) regressions in
      # tool-call extraction. Pure Python (parsers don't import mlx). The
      # relative budget scales parser μs/call by a same-run control workload;
      # interleaved rounds and a median reduce uniform machine-speed noise and
      # isolated scheduler pauses. Different operations do not necessarily
      # scale together across hosted architectures, so this shared-runner lane
      # is intentionally ADVISORY (#2344). The serial M3 release check runs the
      # same script without `--report` and remains the enforced timing gate.
      #
      # PYTHONPATH=. so `from rapid_mlx.tool_parsers...` resolves
      # without installing the package — pytest auto-adds rootdir but
      # bare `python` doesn't, and we don't want a full `pip install -e .`
      # here just for the parser module.
      - name: Parser microbench
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pydantic transformers jsonschema openai-harmony
          python scripts/microbench_parsers.py --report

  mlx-bound-guard:
    # #1248 — a change to an mlx / mlx-lm / mlx-vlm version bound can re-open the
    # upstream-heuristic break that shipped garbage (#1234). It must be gated on a
    # full-family output-coherence sweep (#1247), attested via the
    # `mlx-coherence-swept` label or a `Coherence-Sweep:` PR-body trailer. No-op
    # unless a guarded specifier actually changes. PR-only: it diffs the head
    # against the PR base, which a push-to-main event has no meaningful analogue
    # for (origin/main == the pushed commit).
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.engine == 'true'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install packaging
        run: |
          python -m pip install --upgrade pip
          pip install packaging

      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      - name: Guard mlx/mlx-lm/mlx-vlm version bounds
        env:
          MLX_BOUND_BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_mlx_bound_move.py

  type-check:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine == 'true'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The checked-in budget belongs to this fully pinned type surface.
          pip install --requirement config/mypy-requirements.txt

      - name: Enforce shrink-only mypy error budget
        run: python scripts/check_mypy_error_budget.py

  test-matrix:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine == 'true'
    runs-on: ${{ fromJSON((vars.CI_LINUX_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      # Ordinary PRs run all three shards on Python 3.11, the coverage
      # interpreter. Promoted heads and non-PR events retain all supported
      # Python versions; missing or invalid diffs also fail safe to full.
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # diff-cover compares the PR head with the immutable base SHA. A
          # shallow checkout can make that commit unavailable.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # The lane's test surface is declared in pyproject.toml as the
        # `ci-linux` extra (see its comment for why jinja2 lives there —
        # reasoning-template tests #2445/#2446 render chat templates with it).
        # This lane MUST stay no-MLX (Apple-Silicon-only), so `--no-deps`
        # installs the package without pulling mlx/mlx-lm. The synced
        # requirements file supplies the complete cross-platform unit-test
        # surface without `-e ".[ci-linux]"` dragging MLX onto Linux.
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install --requirement config/requirements-ci-linux.txt

      - name: Run unit tests (no MLX required)
        env:
          COVERAGE_FILE: coverage-linux-${{ matrix.python-version }}-${{ matrix.shard }}.data
          CI_TEST_SHARD: ${{ matrix.shard }}
        # Ordinary unit tests are discovered by directory. MLX-bound modules
        # own a requires_mlx marker + collection guard. Tests that deliberately
        # consume a real HF cache or network are non-hermetic and stay outside
        # this hosted lane; live/integration tests and the isolated fake-MLX
        # process have stable directory boundaries.
        run: |
          set -euo pipefail
          ordinary_plan="$RUNNER_TEMP/ordinary-ignores.txt"
          python scripts/ci_test_shard.py \
            --suite ordinary \
            --shard-index "$CI_TEST_SHARD" \
            --shard-count 3 > "$ordinary_plan"
          mapfile -t ordinary_ignores < "$ordinary_plan"
          pytest \
            tests \
            "${ordinary_ignores[@]}" \
            --ignore=tests/integrations \
            --ignore=tests/headless_mlx \
            -m "not requires_mlx and not real_hf_cache and not requires_network and not slow and not integration and not needle" \
            -o faulthandler_timeout=180 \
            -v --tb=short \
            --cov=rapid_mlx \
            --cov=scripts.sidecar_macho_inventory \
            --cov=scripts.pr_validate.steps.stress_e2e_bench \
            --cov=scripts.pr_validate.queue_ready \
            --cov=scripts.pr_validate.runner \
            --cov=scripts.pr_validate.pr_validate \
            --cov=scripts.merge_on_green \
            --cov=scripts.main_guard \
            --cov=scripts.check_release_source_ref \
            --cov=scripts.check_release_environment \
            --cov=scripts.upload_release_r2 \
            --cov=scripts.release_prepare \
            --cov=scripts.release_control \
            --cov=scripts.classify_ci_changes \
            --cov-report=term-missing

          # These lifecycle contracts install inert MLX modules before import.
          # A separate process prevents those fakes from contaminating normal
          # no-MLX discovery while preserving automatic enrollment by folder.
          headless_plan="$RUNNER_TEMP/headless-ignores.txt"
          python scripts/ci_test_shard.py \
            --suite headless \
            --shard-index "$CI_TEST_SHARD" \
            --shard-count 3 > "$headless_plan"
          mapfile -t headless_ignores < "$headless_plan"
          pytest \
            tests/headless_mlx \
            "${headless_ignores[@]}" \
            -v --tb=short \
            --cov=rapid_mlx \
            --cov-append \
            --cov-report=term-missing

      - name: Install package builder for release-stamp integration test
        if: matrix.python-version == '3.11' && matrix.shard == 1
        run: python -m pip install build

      - name: Run real release-stamp package build
        if: matrix.python-version == '3.11' && matrix.shard == 1
        run: |
          pytest \
            tests/test_release_stamp_scripts.py::test_real_build_ships_the_stamp_in_wheel_and_sdist \
            --run-slow -m slow \
            -v --tb=short

      - name: Run real license-file package build
        if: matrix.python-version == '3.11' && matrix.shard == 1
        run: |
          pytest \
            tests/test_license_files_packaged.py::test_real_distributions_ship_every_tracked_license_file \
            --run-slow -m slow \
            -v --tb=short

      - name: Upload Linux shard coverage data
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-coverage-${{ github.sha }}-${{ matrix.shard }}
          path: coverage-linux-3.11-${{ matrix.shard }}.data
          if-no-files-found: error
          retention-days: 1

  linux-coverage:
    needs: [changes, test-matrix]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine == 'true' &&
      needs.test-matrix.result == 'success'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all Python 3.11 shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: linux-coverage-${{ github.sha }}-*
          path: coverage-data/linux-shards
          merge-multiple: true

      - name: Combine Linux shard coverage
        run: |
          set -euo pipefail
          python -m pip install coverage
          python -m coverage combine coverage-data/linux-shards/coverage-linux-3.11-*.data
          mv .coverage coverage-linux-3.11.data
          COVERAGE_FILE=coverage-linux-3.11.data python -m coverage xml -o coverage.xml

      - name: Upload combined coverage to Codecov
        # The external report is advisory. Keep action bootstrap failures from
        # masking the mandatory local coverage artifact and changed-lines gate.
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload combined Linux coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-coverage-${{ github.sha }}
          path: coverage-linux-3.11.data
          if-no-files-found: error
          retention-days: 1

  test-apple-silicon:
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vision,image]"
          # Test infra comes from the declared `ci-apple` extra (issue #2489).
          pip install -e ".[ci-apple]"

      - name: Verify Apple Silicon
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', 'Not ARM64'"
          python -c "import mlx.core as mx; print(f'MLX OK: {mx.default_device()}')"

      # Shared Linux runners only report this timing signal because their
      # allocation varies enough to false-fail unchanged parsers (#2344).
      # Keep the relative budget enforced automatically on the existing
      # Apple-Silicon lane; this adds no runner allocation or model load.
      - name: Enforce parser relative-budget gate
