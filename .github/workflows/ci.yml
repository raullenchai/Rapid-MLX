  changed-lines-coverage:
    needs:
      - changes
      - linux-coverage
      - test-apple-silicon
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.engine == 'true' &&
      needs.linux-coverage.result == 'success' &&
      needs.test-apple-silicon.result == 'success'
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install coverage tools
        run: pip install coverage "diff-cover==8.0.3"

      - name: Download Linux coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linux-coverage-${{ github.sha }}
          path: coverage-data/linux

      - name: Download Apple Silicon coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apple-coverage-${{ github.sha }}
          path: coverage-data/apple

      - name: Combine coverage and enforce changed lines
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -m coverage combine \
            coverage-data/linux/coverage-linux-3.11.data \
            coverage-data/apple/coverage-apple.data
          python -m coverage xml -o coverage.xml
          python -m diff_cover.diff_cover_tool \
            coverage.xml \
            --compare-branch "$PR_BASE_SHA" \
            --show-uncovered \
            --fail-under 100

  l1-smoke:
    # L1 release-flow gate — a small-model GPU coherence + tool-call format
    # smoke on the FREE macos-14 hosted runner. That runner HAS a real Metal GPU
    # (``mx.default_device()`` -> ``Device(gpu, 0)``), so MLX runs on the GPU
    # there for $0; its ~7GB RAM caps it at small models, not the 35B self-hosted
    # Studio (L2) tier. Runs on promoted and integration heads to catch GROSS
    # engine breakage before landing: garbage-from-first-token (#1234
    # doubled-norm class, via the #1247 GOLDEN gate) and tool-call parser
    # regressions. Ordinary PRs retain Linux + Apple-Silicon coverage without
    # queueing these model downloads.
    #
    # GOLDEN models run coherence + the engine contract. The 4B
    # aliases run contract-only: forcing a zero-argument call factors model
    # competence out while still covering multi-turn replay, streaming channel
    # routing, and native-marker leaks (#1677).
    # Each model runs on its own runner (parallel) so lanes do not share RAM.
    # The Qwen3.5-9B (#2419 top-telemetry cover) was tried here and relocated off
    # L1: its runtime footprint is ~8.7 GB (rapid_mlx/model_recommendations.json,
    # SSOT — bucketed at the 18 GB floor) vs this runner's ~7 GB, and the
    # coherence serve OOMs (server unreachable, 503) under the gate. It, like the
    # 26-35B top-telemetry lanes (Qwen3.6-35B-A3B, Qwen3.8/3.6-27B, Gemma-4-26B,
    # Bonsai-27B, 15-38GB), exceeds this free runner's ~7GB budget — they stay on
    # the self-hosted 35B Studio tier-1 gate (L2), not on L1.
    #
    # Gemma3 is multimodal but this contract is text/tool-only, so the smoke
    # script forces ``--no-mllm`` and exercises its LM backbone without pulling
    # the vision extra. Ministral remains out after its text lane hung (#1367).
    #
    # The aggregate ``tests`` job requires this matrix, so a contract failure is
    # release-blocking rather than an informational red check.
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.engine == 'true' &&
      needs.changes.outputs.full_gate == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      # Don't cancel the other legs when one family fails — we want to see
      # which families regressed, not just the first failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.l1_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # Lean base install — NO ``[vision]`` extra. Both matrix models are
          # text-only, and ``l1_smoke.sh`` serves with ``--no-mllm`` anyway, so
          # the vision/mlx-vlm deps are never needed and the install stays fast.
          pip install -e .
          # coherence_gate.py + l1_toolcall_check.py drive the server over HTTP;
          # httpx is not a runtime dependency of rapid-mlx itself.
          pip install httpx

      - name: Verify Metal GPU
        # macos-14 hosted runners expose a paravirtualized Metal GPU and MLX
        # defaults to it. A CPU-only default here means a broken toolchain, so
        # assert the GPU device rather than silently smoke-testing on CPU.
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          python -c "import mlx.core as mx; d=str(mx.default_device()); assert 'gpu' in d.lower(), d; print('GPU OK:', d)"

      - name: Prefetch model (${{ matrix.model }})
        # rapid-mlx pull uses the R2 mirror (fast — ~40MB/s), so weights are on
        # disk before the serve boot; no actions/cache needed.
        run: rapid-mlx pull "${{ matrix.model }}"

      - name: L1 smoke (coherence + tool-loop contract)
        env:
          RAPID_MLX_PORT: "8123"
          L1_CONTRACT_ONLY: ${{ matrix.contract_only }}
        run: bash scripts/l1_smoke.sh "${{ matrix.model }}"

  tests:
    needs:
      - changes
      - lint
      - engine-contracts
      - mlx-bound-guard
      - type-check
      - test-matrix
      - linux-coverage
      - test-apple-silicon
      - changed-lines-coverage
      - l1-smoke
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    # Keep the required verdict terminal after failure or cancellation;
    # classifier and workload jobs above stop when their source is superseded.
    if: always()
    steps:
      - name: Check test results
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ needs.changes.result }}" != success ]; then
            echo "CI change classifier failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != success ]; then
            echo "Universal repository guards failed"
            exit 1
          fi
          expected="${{ needs.changes.outputs.engine }}"
          if [ "$expected" != "true" ]; then
            echo "Engine lanes not required for this change"
            exit 0
          fi
          if [ "${{ needs.engine-contracts.result }}" != success ]; then
            echo "Engine lint and static contracts failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != success ]; then
            echo "Type-check job failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" = pull_request ] \
            && [ "${{ needs.mlx-bound-guard.result }}" != success ]; then
            echo "MLX dependency-bound guard failed"
            exit 1
          fi
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.linux-coverage.result }}" != "success" ]; then
            echo "Linux shard coverage merge failed"
            exit 1
          fi
          if [ "${{ needs.test-apple-silicon.result }}" != "success" ]; then
            echo "Apple Silicon tests failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" = pull_request ] \
            && [ "${{ needs.changed-lines-coverage.result }}" != "success" ]; then
            echo "Changed-lines coverage union failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.full_gate }}" = "true" ]; then
            if [ "${{ needs.l1-smoke.result }}" != "success" ]; then
              echo "Small-model tool-loop contract failed"
              exit 1
            fi
          elif [ "${{ needs.l1-smoke.result }}" != "skipped" ]; then
            echo "Unpromoted head unexpectedly allocated the L1 smoke lane"
            exit 1
          fi

      - name: Reject cancelled workflow
        if: ${{ cancelled() }}
        run: |
          echo "CI workflow was cancelled"
          exit 1
