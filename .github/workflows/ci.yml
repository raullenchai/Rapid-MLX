name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Merge queue candidates are synthetic commits.  They need their own trigger
  # or GitHub waits forever for the required `tests` check.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.policy.outputs.engine }}
      desktop: ${{ steps.policy.outputs.desktop }}
      docs_only: ${{ steps.policy.outputs.docs_only }}
      full_gate: ${{ steps.policy.outputs.full_gate }}
      l1_matrix: ${{ steps.policy.outputs.l1_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify validation lanes
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Classify the actual diff even during full-ci promotion. Promotion
            # broadens coverage inside the affected lane; it must not turn an
            # engine-only PR into a full Desktop run (or vice versa).
            # Disable rename folding so both the removed source path and the
            # new destination participate in classification.
            git diff --no-renames --name-only "$PR_BASE_SHA" "$GITHUB_SHA" > /tmp/changed-paths
            python scripts/classify_ci_changes.py \
              --paths-file /tmp/changed-paths \
              --github-output "$GITHUB_OUTPUT"
            full_gate="$FULL_CI"
            echo "full_gate=$full_gate" >> "$GITHUB_OUTPUT"
            if [ "$full_gate" = true ]; then
              echo 'l1_matrix={"include":[{"model":"qwen3.5-4b-4bit","contract_only":"0"},{"model":"llama3-3b-4bit","contract_only":"0"},{"model":"gemma3-4b-qat-4bit","contract_only":"1"},{"model":"qwen3-4b-instruct-2507-4bit","contract_only":"1"},{"model":"qwen3-4b-thinking-2507-4bit","contract_only":"1"}]}' >> "$GITHUB_OUTPUT"
            else
              echo 'l1_matrix={"include":[{"model":"qwen3.5-4b-4bit","contract_only":"0"}]}' >> "$GITHUB_OUTPUT"
            fi
          else
            # A merge-group commit may contain several independently classified
            # PRs.  Validate the combined candidate in full. Push-to-main keeps
            # the same coverage as before this policy was introduced.
            {
              echo 'engine=true'
              echo 'desktop=true'
              echo 'docs_only=false'
              echo 'full_gate=true'
              echo 'l1_matrix={"include":[{"model":"qwen3.5-4b-4bit","contract_only":"0"},{"model":"llama3-3b-4bit","contract_only":"0"},{"model":"gemma3-4b-qat-4bit","contract_only":"1"},{"model":"qwen3-4b-instruct-2507-4bit","contract_only":"1"},{"model":"qwen3-4b-thinking-2507-4bit","contract_only":"1"}]}'
            } >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyyaml: check_gha_pinning.py parses workflow YAML (so quoted
          # `uses` forms cannot bypass the SHA-pin gate).
          pip install ruff pyyaml

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      # PF-3 — all GitHub Actions are immutable 40-char commit SHA pins.
      # Dependabot or a reviewed PR is required to advance an action.
      - name: GitHub Actions SHA pinning
        run: python scripts/check_gha_pinning.py

      # An invalid ``${{ … }}`` expression invalidates the WHOLE workflow:
      # the run fails instantly with zero jobs and no log, and because it
      # is not a PR check it never shows up as red on the PR that
      # introduced it. That is how an empty expression inside a `run:`
      # comment took the release pipeline down for a full day.
      - name: Workflow expression sanity
        run: python scripts/check_workflow_expressions.py

      # The model-management diagram and status tables are generated from one
      # reviewed YAML manifest. Fail if a PR edits status/relationships without
      # regenerating the GitHub-facing Mermaid/SVG views.
      - name: Model-management architecture SSOT
        run: python scripts/render_model_management_architecture.py --check

      # The engine and the desktop app ship ONE version number. Keep this
      # universal because either side of that cross-product contract can change.
      - name: Engine ↔ desktop app version sync
        run: python scripts/check_version_sync.py

  engine-contracts:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Structural check — catches "silent flag drop" bugs where a CLI
      # arg is defined but never plumbed to its target config (#400).
      # Pure stdlib + AST — no mlx import required, runs on Linux.
      - name: CLI ↔ Config fidelity audit
        run: python scripts/audit_cli_config_fidelity.py

      # The release scripts cannot be exercised without cutting a release, so
      # their tag-claim, recovery and refuse-to-move paths are covered offline
      # against a mock ``gh``. These existed but nothing ran them, which is how
      # a release-path regression stays invisible until release day. Pure bash,
      # no network/gh/git.
      - name: Release-script offline tests
        run: |
          set -euo pipefail
          for t in tests/release/test_*.sh; do
            echo "── $t"
            bash "$t"
          done

      # install.sh picks the interpreter and builds ~/.rapid-mlx, but it only
      # runs end-to-end on Apple Silicon, so its arch-selection and venv-repair
      # logic (see #1953) is covered offline against fake interpreters. Pure
      # bash, no network/Python/real install — runs on the Linux CI leg.
      - name: Installer offline tests
        run: |
          set -euo pipefail
          for t in tests/install/test_*.sh; do
            echo "── $t"
            bash "$t"
          done

      # Parser microbench — catches >10x regressions in tool-call
      # extraction. Pure Python (parsers don't import mlx); thresholds
      # are intentionally generous (3-5x measured M3 numbers) to
      # absorb ubuntu-latest's shared-hardware variance.
      #
      # PYTHONPATH=. so `from vllm_mlx.tool_parsers...` resolves
      # without installing the package — pytest auto-adds rootdir but
      # bare `python` doesn't, and we don't want a full `pip install -e .`
      # here just for the parser module.
      - name: Parser microbench
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pydantic transformers jsonschema openai-harmony
          python scripts/microbench_parsers.py

  mlx-bound-guard:
    # #1248 — a change to an mlx / mlx-lm / mlx-vlm version bound can re-open the
    # upstream-heuristic break that shipped garbage (#1234). It must be gated on a
    # full-family output-coherence sweep (#1247), attested via the
    # `mlx-coherence-swept` label or a `Coherence-Sweep:` PR-body trailer. No-op
    # unless a guarded specifier actually changes. PR-only: it diffs the head
    # against the PR base, which a push-to-main event has no meaningful analogue
    # for (origin/main == the pushed commit).
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install packaging
        run: |
          python -m pip install --upgrade pip
          pip install packaging

      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      - name: Guard mlx/mlx-lm/mlx-vlm version bounds
        env:
          MLX_BOUND_BASE_REF: origin/${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_mlx_bound_move.py

  type-check:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The checked-in budget belongs to this fully pinned type surface.
          pip install --requirement config/mypy-requirements.txt

      - name: Enforce shrink-only mypy error budget
        run: python scripts/check_mypy_error_budget.py

  test-matrix:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # diff-cover compares the PR head with the immutable base SHA. A
          # shallow checkout can make that commit unavailable.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov "diff-cover==8.0.3" pydantic fastapi jsonschema httpx psutil transformers requests pyyaml

      - name: Run unit tests (no MLX required)
        # NOTE: tests in this list MUST not import mlx / mlx_lm at module
        # load time — Linux CI doesn't have MLX (it's Apple-Silicon only).
        # Tests that need mlx live in the test-apple-silicon job below.
        run: |
          pytest \
            tests/test_mcp_security.py \
            tests/test_structured_output.py \
            tests/test_reasoning_parser.py \
            tests/test_cohere_command_reasoning_parser.py \
            tests/test_responses_route.py::TestResponsesNonStream::test_structured_output_keeps_bare_json_out_of_reasoning \
            tests/test_responses_route.py::TestResponsesStream::test_structured_output_streams_bare_json_as_output_text \
            tests/test_responses_route.py::TestResponsesStream::test_reasoning_cap_uses_command_protocol_boundary \
            tests/test_responses_route.py::TestResponsesStream::test_reasoning_cap_injects_boundary_on_following_chunk \
            tests/test_responses_route.py::TestResponsesStream::test_reasoning_cap_exact_terminal_boundary_finishes_cleanly \
            tests/test_postprocessor.py \
            tests/test_reasoning_parser_truncation_finalize.py \
            tests/test_reasoning_finalize_stop_in_think.py \
            tests/test_per_request_thinking_budget.py \
            tests/test_tool_parsers.py \
            tests/test_native_tool_format.py \
            tests/test_prefix_cache.py \
            tests/test_mllm_cache.py \
            tests/test_api_models.py \
            tests/test_api_utils.py \
            tests/test_request.py \
            tests/test_anthropic_models.py \
            tests/test_anthropic_adapter.py \
            tests/test_harmony_parsers.py \
            tests/test_tool_calling.py \
            tests/test_tool_injection.py \
            tests/test_streaming_latency.py \
            tests/test_streaming_newlines.py \
            tests/test_minimax_reasoning_parser.py \
            tests/test_pr_validate_runner.py \
            tests/test_pr_validate_codex.py \
            tests/test_release_baselines.py \
            tests/test_validate_release_subject.py \
            tests/test_check_gha_pinning.py \
            tests/test_check_mypy_error_budget.py \
            tests/test_classify_ci_changes.py \
            tests/test_ci_lane_promotion.py \
            tests/test_check_mlx_upstream_calls.py \
            tests/test_no_out_of_band_routing.py \
            tests/test_microbench_parsers.py \
            tests/test_telemetry_emit.py \
            tests/test_telemetry_consent.py \
            tests/test_community_bench_upload.py \
            tests/test_music_engine.py \
            tests/test_aliases_contract.py \
            tests/test_chat_template_registry.py \
            tests/test_alias_subfolder.py \
            tests/test_ram_tier_recommendations_agree.py \
            tests/test_version_sync.py \
            -v --tb=short \
            -k "not Integration and not InjectJson and not TestMLXMultimodalLMCache" \
            --cov=vllm_mlx \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Enforce changed-lines coverage
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m diff_cover.diff_cover_tool \
            coverage.xml \
            --compare-branch "$PR_BASE_SHA" \
            --show-uncovered \
            --fail-under 100

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-apple-silicon:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vision]"
          pip install pytest pytest-asyncio

      - name: Verify Apple Silicon
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', 'Not ARM64'"
          python -c "import mlx.core as mx; print(f'MLX OK: {mx.default_device()}')"

      - name: Run MLX-dependent tests
        # SimpleEngine was removed in PR #156 — test_simple_engine.py,
        # test_llm.py, test_deltanet_snapshot.py went with it.
        # test_memory_cache exercises mlx-importing code paths so it
        # lives here, not in the Linux test-matrix job.
        run: |
          pytest \
            tests/test_mllm.py \
            tests/test_server.py \
            tests/test_paged_cache.py \
            tests/test_mllm_continuous_batching.py \
            tests/test_mllm_cache.py \
            tests/test_memory_cache.py \
            tests/test_optimizations.py \
            tests/test_batching.py \
            tests/test_continuous_batching.py \
            tests/test_streaming_simulator.py \
            tests/test_streaming_detokenizer.py \
            tests/test_tool_logits.py \
            tests/test_no_mllm_flag.py \
            tests/test_audio_music_route.py \
            tests/test_audio_route_registration_gate.py \
            tests/test_forced_alignment_route_hardening.py \
            tests/test_muse_glimmer_model.py \
            tests/test_bailing_hybrid_model.py \
            tests/test_mtp_spec_decode.py \
            -v --tb=short \
            -m "not slow" \
            -k "not Integration"

  l1-smoke:
    # L1 release-flow gate — a small-model GPU coherence + tool-call format
    # smoke on the FREE macos-14 hosted runner. That runner HAS a real Metal GPU
    # (``mx.default_device()`` -> ``Device(gpu, 0)``), so MLX runs on the GPU
    # there for $0; its ~7GB RAM caps it at small models, not the 35B self-hosted
    # Studio (L2) tier. Runs on every PR to catch GROSS engine breakage BEFORE
    # the expensive Studio gate: garbage-from-first-token (#1234 doubled-norm
    # class, via the #1247 GOLDEN gate) and tool-call parser regressions.
    #
    # Two GOLDEN models run coherence + the engine contract. The remaining 4B
    # aliases run contract-only: forcing a zero-argument call factors model
    # competence out while still covering multi-turn replay, streaming channel
    # routing, and native-marker leaks (#1677).
    # Each model runs on its own runner (parallel), so ~7GB RAM holds one ~2GB
    # model comfortably. A 3-4B model is fine for a coherence/parser gate — it
    # is not a chat-quality eval, which stays on the 35B L2 tier.
    #
    # Gemma3 is multimodal but this contract is text/tool-only, so the smoke
    # script forces ``--no-mllm`` and exercises its LM backbone without pulling
    # the vision extra. Ministral remains out after its text lane hung (#1367).
    #
    # The aggregate ``tests`` job requires this matrix, so a contract failure is
    # release-blocking rather than an informational red check.
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      # Don't cancel the other legs when one family fails — we want to see
      # which families regressed, not just the first failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.l1_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # Lean base install — NO ``[vision]`` extra. Both matrix models are
          # text-only, and ``l1_smoke.sh`` serves with ``--no-mllm`` anyway, so
          # the vision/mlx-vlm deps are never needed and the install stays fast.
          pip install -e .
          # coherence_gate.py + l1_toolcall_check.py drive the server over HTTP;
          # httpx is not a runtime dependency of rapid-mlx itself.
          pip install httpx

      - name: Verify Metal GPU
        # macos-14 hosted runners expose a paravirtualized Metal GPU and MLX
        # defaults to it. A CPU-only default here means a broken toolchain, so
        # assert the GPU device rather than silently smoke-testing on CPU.
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          python -c "import mlx.core as mx; d=str(mx.default_device()); assert 'gpu' in d.lower(), d; print('GPU OK:', d)"

      - name: Prefetch model (${{ matrix.model }})
        # rapid-mlx pull uses the R2 mirror (fast — ~40MB/s), so weights are on
        # disk before the serve boot; no actions/cache needed.
        run: rapid-mlx pull "${{ matrix.model }}"

      - name: L1 smoke (coherence + tool-loop contract)
        env:
          RAPID_MLX_PORT: "8123"
          L1_CONTRACT_ONLY: ${{ matrix.contract_only }}
        run: bash scripts/l1_smoke.sh "${{ matrix.model }}"

  tests:
    needs:
      - changes
      - lint
      - engine-contracts
      - mlx-bound-guard
      - type-check
      - test-matrix
      - test-apple-silicon
      - l1-smoke
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.changes.result }}" != success ]; then
            echo "CI change classifier failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != success ]; then
            echo "Universal repository guards failed"
            exit 1
          fi
          expected="${{ needs.changes.outputs.engine }}"
          if [ "$expected" != "true" ]; then
            echo "Engine lanes not required for this change"
            exit 0
          fi
          if [ "${{ needs.engine-contracts.result }}" != success ]; then
            echo "Engine lint and static contracts failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != success ]; then
            echo "Type-check job failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" = pull_request ] \
            && [ "${{ needs.mlx-bound-guard.result }}" != success ]; then
            echo "MLX dependency-bound guard failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ needs.changes.outputs.full_gate }}" != "true" ]; then
            echo "Engine PR gate passed; apply the full-ci label when this PR is ready to merge"
            exit 1
          fi
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.test-apple-silicon.result }}" != "success" ]; then
            echo "Apple Silicon tests failed"
            exit 1
          fi
          if [ "${{ needs.l1-smoke.result }}" != "success" ]; then
            echo "Small-model tool-loop contract failed"
            exit 1
          fi
