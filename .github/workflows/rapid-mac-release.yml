# Signed + notarised release build for the rapid-mac desktop app.
#
# This workflow is a scrubbed, monorepo-adapted reconstruction of the
# private desktop repo's release.yml. It builds apps/rapid-mac/ (the
# SwiftUI app + its bundled rapid-mlx sidecar), signs it with a Developer
# ID identity, notarises + staples both the .app and the .dmg, and
# attaches the DMG to the GitHub Release for the tag.
#
# Trigger: pushing a ``rapid-mac-v*`` tag. The ``rapid-mac-v`` prefix keeps
# app releases from colliding with the engine's own ``v*`` release tags in
# this same monorepo. A manual workflow_dispatch does the same build but
# only uploads a workflow artifact (no GitHub Release), so signing can be
# dry-run without cutting a tag.
#
# ── Required GitHub Actions secrets (Settings → Secrets and variables →
#    Actions → New repository secret). Values are the USER's Apple-account
#    secrets — this workflow never contains any of them, only their names:
#
#   MACOS_DEVID_CERT_P12_BASE64  base64 of the Developer ID Application .p12
#   MACOS_DEVID_CERT_PASSWORD    the .p12 export password
#   APPLE_TEAM_ID                10-char Apple Team ID
#   AC_API_KEY_ID                App Store Connect API key id (notarisation)
#   AC_API_ISSUER_ID             App Store Connect issuer id
#   AC_API_KEY_P8_BASE64         base64 of the AuthKey_XXX.p8
#   SPARKLE_ED_PRIVATE_KEY       private Ed25519 key exported by Sparkle's
#                                generate_keys tool (base64 text)
#
#   Required for tagged releases (the "mirror-dist" and
#   "publish-updater-fallback" jobs at the bottom). NOTE: on a tag these are
#   not optional in any sense — the GitHub Release is created by the LAST of
#   those jobs, so without these no release is published at all. That is
#   deliberate: a release that ships while its updater pointer does not is
#   exactly #1851, and it survived three releases because the two could
#   diverge.
#   CLOUDFLARE_API_TOKEN         token scoped to Workers R2 Storage:Edit on
#                                the distribution bucket and Zone Cache Purge
#   CLOUDFLARE_ACCOUNT_ID        account id wrangler operates against
#   CLOUDFLARE_ZONE_ID           zone id for purging dl.rapidmlx.com/latest.json
#
#   Presence and usability of all of the above are checked on the version-bump
#   PR by the PF-2 gate in release-preflight.yml, so a missing or expired
#   credential surfaces before the tag exists rather than after the build.
#
#   Required for tagged releases — as Actions
#   VARIABLES (not secrets), since they are config, not credentials:
#   RAPID_MAC_DIST_R2_BUCKET     name of the R2 bucket to mirror the DMG into
#   RAPID_MAC_DIST_CDN_BASE      public CDN base URL that fronts the bucket
#   SPARKLE_PUBLIC_ED_KEY        SUPublicEDKey value printed by generate_keys
#
# NOTE: Sentry has been removed from the monorepo app; there is no
# SENTRY_DSN secret here (the desktop workflow had one).
#
# NOTE: GitHub reads this workflow from ``.github/workflows`` at the
# repository root. This is the canonical Rapid Mac release workflow.
#
# The temp keychain password is generated at runtime, never stored.
name: rapid-mac-release

on:
  push:
    tags:
      - "rapid-mac-v*"
  workflow_dispatch:

permissions:
  contents: write   # attach the .dmg to the GitHub Release
  actions: read     # turnstyle queues updater publication across tag runs

jobs:
  build:
    runs-on: macos-15   # default Xcode 16 → Swift 6.0 (Package.swift tools 6.0)
    outputs:
      # Published so the release-creating job can decide "--prerelease" without
      # restating the secret expression below. Two copies of the same predicate
      # would silently disagree the first time the signing secret set changes.
      signed: ${{ steps.signing_state.outputs.signed }}
    defaults:
      run:
        # All script/shell steps run from the app directory so the
        # in-repo scripts (which resolve $ROOT relative to themselves) and
        # their ``build/...`` outputs line up. ``uses:`` steps ignore this
        # and take repo-root-relative paths (see the explicit
        # ``apps/rapid-mac/`` prefixes below).
        working-directory: apps/rapid-mac
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      # Signing is OPTIONAL. When the Developer ID + notary secrets are all
      # present we Developer-ID sign + notarise (a clean, double-clickable
      # release). When they are absent (e.g. an early internal-testing build
      # before the Apple account is wired up) the job still runs: it produces
      # an AD-HOC signed, un-notarised DMG and publishes it as a PRE-RELEASE
      # with a "right-click → Open" note. Re-running the same tag once the
      # secrets land upgrades it to a proper signed release.
      SIGNED: ${{ secrets.MACOS_DEVID_CERT_P12_BASE64 != '' && secrets.MACOS_DEVID_CERT_PASSWORD != '' && secrets.AC_API_KEY_P8_BASE64 != '' && secrets.AC_API_KEY_ID != '' && secrets.AC_API_ISSUER_ID != '' }}
      # Absolute .app size ceiling — enforced by the "Bundle size gate"
      # step. The bundled sidecar (Contents/Resources/rapid-mlx) dominates.
      BUNDLE_SIZE_CAP_MB: "500"
      # Per-release DMG growth ceiling — enforced by the "Bundle size delta
      # gate" step against the previous rapid-mac release.
      BUNDLE_SIZE_DELTA_CAP_MB: "50"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Full history + tags. scripts/build.sh derives the sidecar
          # VERSION from the engine's pyproject.toml at the repo root, with
          # an engine ``v*`` git-tag fallback that needs ancestry to walk.
          # MONOREPO: NO submodules — the rapid-mlx engine IS this
          # repository (apps/rapid-mac is a subdirectory of it).
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Host python3 is used by scripts/build-sidecar-tarball.sh (only when
      # the optional bootstrapper tarball is built) and by the optional
      # BUNDLE_MODEL snapshot path in scripts/build.sh (off by default). The
      # sidecar's OWN interpreter is a pinned python-build-standalone that
      # scripts/build-sidecar.sh downloads — this setup-python does not
      # affect the shipped bundle or its Mach-O signing baseline.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Import Developer ID certificate into a temp keychain
        if: env.SIGNED == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_DEVID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/devid.p12"

          # Decode the cert (openssl avoids BSD-vs-GNU base64 flag drift).
          printf %s "$CERT_P12_BASE64" | openssl base64 -d -A -out "$CERT_PATH"

          # Fresh, isolated keychain — torn down in the always() step.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Let codesign use the key non-interactively.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          # Put the temp keychain on the search list (keep user keychains).
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          # Resolve the Developer ID Application identity's SHA-1 and hand it
          # to build.sh / dmg.sh via CODESIGN_IDENTITY.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the imported cert"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Imported identity: $IDENTITY"

      - name: Decode notarisation API key
        if: env.SIGNED == 'true'
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf %s "$AC_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$KEY_PATH"
          echo "AC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Extract CHANGELOG section for this tag
        # Slice the ``## [X.Y.Z]`` block out of CHANGELOG.md so the GitHub
        # release body is the hand-curated narrative rather than an
        # auto-generated PR list. Parks it in $RUNNER_TEMP so the "Attach to
        # GitHub Release" step references the same bytes. Falls back to a
        # one-line placeholder if the section is missing so the release
        # still publishes.
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-notes.md"
          TAG="${GITHUB_REF_NAME:-}"
          # ``rapid-mac-v0.11.0`` → ``0.11.0``. On workflow_dispatch the ref
          # is a branch, so VERSION is empty and the placeholder branch runs.
          VERSION="${TAG#rapid-mac-v}"
          [[ "$VERSION" == "$TAG" ]] && VERSION=""   # ref wasn't a rapid-mac-v tag
          if [[ -f CHANGELOG.md && -n "$VERSION" ]]; then
            awk -v needle="## [${VERSION}]" '
              {
                if (index($0, needle) == 1) { in_section = 1; print; next }
                if (in_section && /^## /) { exit }
                if (in_section) { print }
              }
            ' CHANGELOG.md > "$OUT"
          fi
          if [[ ! -s "$OUT" ]]; then
            echo "Release ${TAG:-<dispatch>} (no CHANGELOG.md section found)." > "$OUT"
          fi
          # Unsigned build: this DMG is ad-hoc signed + un-notarised. macOS
          # quarantines anything downloaded and Gatekeeper hard-blocks an
          # un-notarised app ("damaged / can't be opened"), so the download
          # won't just double-click — prepend the right-click / xattr
          # workaround. Done HERE, while composing the notes, so the release
          # body and the updater manifest's ``notes`` field are the same bytes.
          # Previously the preamble was added at release-creation time only, so
          # a reader of latest.json saw notes the release page did not.
          if [[ "${SIGNED:-}" != "true" ]]; then
            {
              echo "> ⚠️ **Unsigned internal build.** This DMG is ad-hoc signed and NOT notarised."
              echo "> macOS Gatekeeper will block it on first open. To run it:"
              echo ">"
              echo "> 1. Drag **Rapid-MLX Desktop** to Applications, then **right-click the app → Open** (once), or"
              echo "> 2. \`xattr -dr com.apple.quarantine \"/Applications/Rapid-MLX Desktop.app\"\`"
              echo ">"
              echo "> A signed + notarised build that opens with a normal double-click will replace this once signing is configured."
              echo ""
              cat "$OUT"
            } > "$OUT.tmp"
            mv "$OUT.tmp" "$OUT"
          fi
          echo "RELEASE_NOTES_FILE=$OUT" >> "$GITHUB_ENV"
          echo "::group::Release notes"
          cat "$OUT"
          echo "::endgroup::"

      - name: Record whether this build was signed
        id: signing_state
        # Exported as a job output so the release-creating job in the
        # publishing stage does not restate the secret-presence expression.
        run: echo "signed=${SIGNED}" >> "$GITHUB_OUTPUT"

      - name: Stage release notes for the publishing job
        # The GitHub Release is now created at the very END of the pipeline
        # (see publish-updater-fallback), so the notes have to outlive this
        # job. They are also the manifest's ``notes`` field, which mirror-dist
        # used to read back off the created release.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-mac-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Build + sign Rapid-MLX Desktop.app
        # build.sh assembles the .app, builds + signs the bundled sidecar
        # from the engine at the repo root (RAPID_MLX_SOURCE defaults to
        # apps/rapid-mac/../.. — the monorepo root), and Developer-ID signs
        # the bundle with CODESIGN_IDENTITY (exported above).
        env:
          # Only signed builds enable Sparkle. An ad-hoc build cannot update a
          # Developer-ID-signed installation because code-signing continuity
          # validation correctly rejects it.
          SPARKLE_PUBLIC_ED_KEY: ${{ env.SIGNED == 'true' && vars.SPARKLE_PUBLIC_ED_KEY || '' }}
        run: |
          set -euo pipefail
          if [[ "${SIGNED}" == "true" && -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "::error::signed releases require the SPARKLE_PUBLIC_ED_KEY Actions variable"
            exit 1
          fi
          bash scripts/build.sh

      - name: Bundle size gate (block if .app exceeds BUNDLE_SIZE_CAP_MB)
        # Runs BEFORE notarisation so an oversize bundle fails fast without
        # burning an Apple notary submission.
        run: |
          set -euo pipefail
          APP="build/Rapid-MLX Desktop.app"
          SIDECAR="$APP/Contents/Resources/rapid-mlx"
          CAP_MB="${BUNDLE_SIZE_CAP_MB:-500}"

          if [[ ! -d "$APP" ]]; then
            echo "::error::Expected $APP to exist after build step but it does not."
            exit 1
          fi

          APP_MB=$(du -sm "$APP" | awk '{print $1}')
          if [[ -d "$SIDECAR" ]]; then
            SIDECAR_MB=$(du -sm "$SIDECAR" | awk '{print $1}')
          else
            SIDECAR_MB="0 (sidecar dir missing — investigate)"
          fi
          echo "::notice::Rapid-MLX Desktop.app = ${APP_MB} MB (cap ${CAP_MB} MB); sidecar = ${SIDECAR_MB} MB"

          echo "::group::Bundle size breakdown"
          SITE_PACKAGES="$SIDECAR/site-packages"
          if [[ -d "$SITE_PACKAGES" ]]; then
            echo "Top 10 largest dirs under site-packages/:"
            du -sm "$SITE_PACKAGES"/* 2>/dev/null | sort -rn | head -10 || true
          fi
          echo "::endgroup::"

          if [[ "$APP_MB" -gt "$CAP_MB" ]]; then
            echo "::error::Rapid-MLX Desktop.app is ${APP_MB} MB which exceeds the ${CAP_MB} MB cap (bump BUNDLE_SIZE_CAP_MB if intentional)."
            exit 1
          fi

      - name: Notarise + staple Rapid-MLX Desktop.app
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "build/Rapid-MLX Desktop.app" "build/Rapid-MLX-Desktop.zip"
          bash scripts/notarize.sh "build/Rapid-MLX-Desktop.zip" "build/Rapid-MLX Desktop.app"

      - name: Build signed Sparkle archive and appcast
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          CDN_BASE: ${{ vars.RAPID_MAC_DIST_CDN_BASE }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ -n "${SPARKLE_ED_PRIVATE_KEY:-}" ]] || {
            echo "::error::signed releases require SPARKLE_ED_PRIVATE_KEY"
            exit 1
          }
          [[ "$CDN_BASE" == "https://dl.rapidmlx.com" ]] || {
            echo "::error::RAPID_MAC_DIST_CDN_BASE must be https://dl.rapidmlx.com"
            exit 1
          }
          VERSION="${TAG#rapid-mac-v}"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            'build/Rapid-MLX Desktop.app/Contents/Info.plist')"
          [[ "$APP_BUILD" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::CFBundleVersion must be a positive integer for Sparkle"
            exit 1
          }
          PREVIOUS_TAG="$(git tag -l 'rapid-mac-v*' --sort=v:refname \
            | awk -v current="$TAG" \
                '$0 ~ /^rapid-mac-v[0-9]+\.[0-9]+\.[0-9]+$/ { \
                  if ($0 == current) { print previous; exit } \
                  previous=$0 \
                }')"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_BUILD="$(git show \
              "${PREVIOUS_TAG}:apps/rapid-mac/Resources/Info.plist" \
              | plutil -extract CFBundleVersion raw -o - - 2>/dev/null || true)"
            [[ "$PREVIOUS_BUILD" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::cannot read CFBundleVersion from ${PREVIOUS_TAG}"
              exit 1
            }
            (( APP_BUILD > PREVIOUS_BUILD )) || {
              echo "::error::CFBundleVersion ${APP_BUILD} must exceed ${PREVIOUS_TAG} build ${PREVIOUS_BUILD} for Sparkle"
              exit 1
            }
          fi
          OUT="build/sparkle"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          TEMP_ZIP="$OUT/Rapid-MLX-Desktop-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Rapid-MLX Desktop.app" "$TEMP_ZIP"
          ZIP_SHA256="$(shasum -a 256 "$TEMP_ZIP" | awk '{print $1}')"
          ZIP_NAME="Rapid-MLX-Desktop-${VERSION}-${ZIP_SHA256}.zip"
          mv "$TEMP_ZIP" "$OUT/$ZIP_NAME"
          cp "$RELEASE_NOTES_FILE" "$OUT/${ZIP_NAME%.zip}.md"

          GENERATE_APPCAST=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          [[ -x "$GENERATE_APPCAST" ]] || {
            echo "::error::Sparkle generate_appcast tool missing"
            exit 1
          }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | "$GENERATE_APPCAST" --ed-key-file - \
                --download-url-prefix "${CDN_BASE}/rapid-mac/${VERSION}/" \
                --embed-release-notes --maximum-versions 1 --maximum-deltas 0 \
                -o "$OUT/appcast.xml" "$OUT"
          [[ -s "$OUT/appcast.xml" ]] || { echo "::error::appcast not generated"; exit 1; }
          grep -Fq "sparkle:edSignature=" "$OUT/appcast.xml" || {
            echo "::error::appcast enclosure has no EdDSA signature"
            exit 1
          }
          EXPECTED_URL="${CDN_BASE}/rapid-mac/${VERSION}/${ZIP_NAME}"
          APPCAST_VERSION="$(xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="version"])' \
            "$OUT/appcast.xml")"
          APPCAST_SHORT_VERSION="$(xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="shortVersionString"])' \
            "$OUT/appcast.xml")"
          APPCAST_URL="$(xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"][1]/*[local-name()="enclosure"]/@url)' \
            "$OUT/appcast.xml")"
          [[ "$APPCAST_VERSION" == "$APP_BUILD" ]] || {
            echo "::error::appcast build version does not match the signed app"
            exit 1
          }
          [[ "$APPCAST_SHORT_VERSION" == "$VERSION" ]] || {
            echo "::error::appcast release version does not match the tag"
            exit 1
          }
          [[ "$APPCAST_URL" == "$EXPECTED_URL" ]] || {
            echo "::error::appcast URL does not match the mirrored Sparkle ZIP"
            exit 1
          }

      - name: Upload Sparkle update artifact
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-mac-sparkle-update
          path: |
            apps/rapid-mac/build/sparkle/*.zip
            apps/rapid-mac/build/sparkle/appcast.xml
          if-no-files-found: error
          retention-days: 7

      - name: Build + sign rapid-mlx-desktop.dmg (from the stapled app)
        run: bash scripts/dmg.sh

      - name: Bundle size delta gate (block if DMG grew > cap vs previous rapid-mac release)
        # Second-line bloat defence — diffs this DMG against the previous
        # ``rapid-mac-v*`` release's DMG. Skips cleanly on the first release.
        # Runs before notarisation so a regression doesn't burn a submission.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="build/rapid-mlx-desktop.dmg"
          DELTA_CAP_MB="${BUNDLE_SIZE_DELTA_CAP_MB:-50}"
          [[ -f "$DMG" ]] || { echo "::error::missing $DMG"; exit 1; }
          CURRENT_DMG_MB=$(du -sm "$DMG" | awk '{print $1}')
          CURRENT_TAG="${GITHUB_REF_NAME}"

          # Only compare against OTHER rapid-mac releases (filter out the
          # engine's own releases in this monorepo, and the current tag).
          PREV_TAG=$(gh release list --limit 40 --exclude-drafts \
            --json tagName -q '.[].tagName' \
            | grep '^rapid-mac-v' \
            | grep -vxF "$CURRENT_TAG" \
            | head -1 || true)
          if [[ -z "$PREV_TAG" ]]; then
            echo "::notice::no previous rapid-mac release to diff — skipping delta gate (current DMG = ${CURRENT_DMG_MB} MB)"
            exit 0
          fi

          CANONICAL_DMG_NAME="rapid-mlx-desktop.dmg"
          PREV_DMG_BYTES=$(gh release view "$PREV_TAG" --json assets \
            -q ".assets[] | select(.name == \"${CANONICAL_DMG_NAME}\") | .size" | head -1 || true)
          if [[ -z "$PREV_DMG_BYTES" ]]; then
            echo "::notice::previous release ${PREV_TAG} has no '${CANONICAL_DMG_NAME}' asset — skipping delta gate."
            exit 0
          fi

          PREV_DMG_MB=$(awk -v b="$PREV_DMG_BYTES" 'BEGIN { printf "%d", (b/1000000) + 0.5 }')
          DELTA_MB=$(( CURRENT_DMG_MB - PREV_DMG_MB ))
          echo "::notice::DMG delta vs ${PREV_TAG}: ${CURRENT_DMG_MB} - ${PREV_DMG_MB} = ${DELTA_MB} MB (cap +${DELTA_CAP_MB} MB)"
          if [[ "$DELTA_MB" -gt "$DELTA_CAP_MB" ]]; then
            echo "::error::DMG grew by ${DELTA_MB} MB vs ${PREV_TAG}, exceeding +${DELTA_CAP_MB} MB (bump BUNDLE_SIZE_DELTA_CAP_MB if intentional)."
            exit 1
          fi

      - name: Validate DMG contents (app bundle + Applications symlink)
        run: bash scripts/validate-dmg.sh build/rapid-mlx-desktop.dmg

      - name: Notarise + staple rapid-mlx-desktop.dmg
        if: env.SIGNED == 'true'
        run: bash scripts/notarize.sh build/rapid-mlx-desktop.dmg build/rapid-mlx-desktop.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-mlx-desktop-dmg
          # uses: step — path is repo-root-relative (working-directory does
          # not apply to actions).
          path: apps/rapid-mac/build/rapid-mlx-desktop.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Clean up temp keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  # ─────────────────────────────────────────────────────────────────────
  # REQUIRED FOR TAGS: mirror the notarised DMG and update the static fallback.
  #
  # The public GitHub Release (attached above) remains the canonical download.
  # This job also publishes the static updater fallback used when the update
  # Worker is unavailable. A tagged release is incomplete unless both the DMG
  # mirror and latest.json are current, so missing distribution configuration
  # is a hard failure rather than a successful no-op.
  #
  #   * No hardcoded bucket name (desktop used a specific private bucket) —
  #     read from the ``RAPID_MAC_DIST_R2_BUCKET`` Actions VARIABLE.
  #   * No hardcoded CDN hostname (desktop used dl.rapidmlx.com) — read from
  #     the ``RAPID_MAC_DIST_CDN_BASE`` Actions VARIABLE.
  #   * The manifest is uploaded last, after the immutable DMG, so clients can
  #     never observe a release whose artifact is not available yet.
  mirror-dist:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download the notarised DMG artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mlx-desktop-dmg
          path: dist

      - name: Download the staged release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mac-release-notes
          path: notes

      - name: Download the signed Sparkle update
        if: needs.build.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mac-sparkle-update
          path: sparkle

      - name: Mirror update archives and compose updater fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.RAPID_MAC_DIST_R2_BUCKET }}
          CDN_BASE: ${{ vars.RAPID_MAC_DIST_CDN_BASE }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "${R2_BUCKET:-}" ]] || missing+=(RAPID_MAC_DIST_R2_BUCKET)
          [[ -n "${CDN_BASE:-}" ]] || missing+=(RAPID_MAC_DIST_CDN_BASE)
          if (( ${#missing[@]} )); then
            echo "::error::tagged releases require updater fallback publishing; missing: ${missing[*]}"
            exit 1
          fi
          [[ "$R2_BUCKET" == "rapid-desktop-dist" ]] || {
            echo "::error::RAPID_MAC_DIST_R2_BUCKET must be rapid-desktop-dist"
            exit 1
          }
          [[ "$CDN_BASE" == "https://dl.rapidmlx.com" ]] || {
            echo "::error::RAPID_MAC_DIST_CDN_BASE must be https://dl.rapidmlx.com"
            exit 1
          }
          VERSION="${TAG#rapid-mac-v}"
          [[ "$TAG" =~ ^rapid-mac-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be rapid-mac-vMAJOR.MINOR.PATCH"
            exit 1
          }
          DMG="dist/rapid-mlx-desktop.dmg"
          [[ -f "$DMG" ]] || { echo "::error::missing $DMG"; exit 1; }
          DMG_SHA256="$(sha256sum "$DMG" | awk '{print $1}')"
          DMG_SIZE="$(stat -c %s "$DMG")"

          # Content-address the canonical payload. A rerun of the same tag can
          # never overwrite bytes referenced by an older manifest checksum.
          VERSIONED_KEY="rapid-mac/${VERSION}/rapid-mlx-desktop-${DMG_SHA256}.dmg"
          DMG_URL="${CDN_BASE%/}/${VERSIONED_KEY}"

          npx --yes wrangler@4.120.0 r2 object put "${R2_BUCKET}/${VERSIONED_KEY}" \
            --file "$DMG" --content-type application/x-apple-diskimage --remote

          if [[ "${{ needs.build.outputs.signed }}" == "true" ]]; then
            SPARKLE_ZIP="$(find sparkle -maxdepth 1 -type f -name '*.zip' -print -quit)"
            [[ -n "$SPARKLE_ZIP" && -f "$SPARKLE_ZIP" ]] || {
              echo "::error::missing signed Sparkle ZIP"
              exit 1
            }
            SPARKLE_KEY="rapid-mac/${VERSION}/$(basename "$SPARKLE_ZIP")"
            npx --yes wrangler@4.120.0 r2 object put "${R2_BUCKET}/${SPARKLE_KEY}" \
              --file "$SPARKLE_ZIP" --content-type application/zip --remote
          fi

          # The GitHub Release does not exist yet — it is created only once this
          # manifest is live (see publish-updater-fallback), so a failure here
          # can no longer leave a published release pointing at a stale updater
          # manifest (#1851). The notes are the same bytes the release is
          # created from, so they need no release API call either.
          #
          # html_url is the link an installed app offers when it cannot install
          # for the user. It must NOT be the release page on this repo: the repo
          # is private, so that URL 404s for every end user — which is exactly
          # what shipped until now. Point it at the public download page, the
          # same value the landing Worker serves for the other feed.
          HTML_URL="https://rapidmlx.com/desktop"
          NOTES_FILE="notes/release-notes.md"
          [[ -s "$NOTES_FILE" ]] || { echo "::error::missing $NOTES_FILE"; exit 1; }
          # published_at is the moment the release becomes fetchable, which is
          # now rather than whenever the release object is later created. The
          # client decodes it but drives nothing off it (version comparison is
          # what orders releases), so the few minutes' difference is cosmetic.
          jq -n \
            --arg version "$VERSION" \
            --arg tag_name "$TAG" \
            --arg html_url "$HTML_URL" \
            --rawfile notes "$NOTES_FILE" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dmg_url "$DMG_URL" \
            --arg dmg_sha256 "$DMG_SHA256" \
            --argjson dmg_size "$DMG_SIZE" \
            '{schema_version: 1, version: $version, tag_name: $tag_name,
              html_url: $html_url, notes: $notes, published_at: $published_at,
              dmg_url: $dmg_url, dmg_sha256: $dmg_sha256, dmg_size: $dmg_size}' \
            > dist/latest.json
          jq -e --arg version "$VERSION" --arg dmg_url "$DMG_URL" \
            '.schema_version == 1 and .version == $version and .dmg_url == $dmg_url' \
            dist/latest.json >/dev/null

      - name: Stage updater manifest for serialized publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-mac-update-manifest
          path: dist/latest.json
          if-no-files-found: error

      - name: Stage Sparkle appcast for serialized publication
        if: needs.build.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapid-mac-sparkle-appcast
          path: sparkle/appcast.xml
          if-no-files-found: error

  # Every tag mirrors its immutable DMG above. Only the mutable pointer is
  # serialized here. Turnstyle queues every run (unlike native concurrency,
  # which keeps only one pending run and can drop an intermediate tag).
  publish-updater-fallback:
    needs: [build, mirror-dist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Queue behind earlier updater publications
        uses: softprops/turnstyle@afaccda0f3c0136fb7cb4a734b9b96be03599948  # v3.3.2
        with:
          token: ${{ github.token }}
          same-branch-only: false
          poll-interval-seconds: 10

      - name: Download staged updater manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mac-update-manifest
          path: dist

      - name: Download DMG for stable compatibility alias
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mlx-desktop-dmg
          path: dist-dmg

      - name: Download the staged release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mac-release-notes
          path: notes

      - name: Download staged Sparkle appcast
        if: needs.build.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rapid-mac-sparkle-appcast
          path: sparkle

      - name: Publish updater fallback monotonically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          R2_BUCKET: ${{ vars.RAPID_MAC_DIST_R2_BUCKET }}
          CDN_BASE: ${{ vars.RAPID_MAC_DIST_CDN_BASE }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_ZONE_ID:-}" ]] || {
            echo "::error::Cloudflare API token, account id, and zone id are required to publish latest.json"
            exit 1
          }
          [[ "$R2_BUCKET" == "rapid-desktop-dist" ]] || {
            echo "::error::RAPID_MAC_DIST_R2_BUCKET must be rapid-desktop-dist"
            exit 1
          }
          [[ "$CDN_BASE" == "https://dl.rapidmlx.com" ]] || {
            echo "::error::RAPID_MAC_DIST_CDN_BASE must be https://dl.rapidmlx.com"
            exit 1
          }
          TARGET_VERSION="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' dist/latest.json)"

          # Treat only a genuinely absent pointer as first publication. Auth,
          # network, and parse failures remain fatal rather than bypassing the
          # rollback guard.
          if GET_OUTPUT="$(npx --yes wrangler@4.120.0 r2 object get "${R2_BUCKET}/latest.json" \
              --file dist/current-latest.json --remote 2>&1)"; then
            CURRENT_VERSION="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' dist/current-latest.json)"
            if dpkg --compare-versions "$CURRENT_VERSION" gt "$TARGET_VERSION"; then
              echo "::notice::Skipping stale updater manifest ${TARGET_VERSION}; current is ${CURRENT_VERSION}"
              exit 0
            fi
          elif grep -Fq "The specified key does not exist." <<<"$GET_OUTPUT"; then
            echo "::notice::No current latest.json; publishing the initial pointer"
          else
            printf '%s\n' "$GET_OUTPUT" >&2
            exit 1
          fi

          # Publish the updater's canonical pointer first. It references the
          # already-present content-addressed DMG, never the mutable alias.
          npx --yes wrangler@4.120.0 r2 object put "${R2_BUCKET}/latest.json" \
            --file dist/latest.json --content-type application/json \
            --cache-control "no-cache, must-revalidate" --remote

          if [[ "${{ needs.build.outputs.signed }}" == "true" ]]; then
            [[ -s sparkle/appcast.xml ]] || { echo "::error::missing appcast.xml"; exit 1; }
            npx --yes wrangler@4.120.0 r2 object put "${R2_BUCKET}/appcast.xml" \
              --file sparkle/appcast.xml --content-type application/xml \
              --cache-control "no-cache, must-revalidate" --remote
          fi

          # Preserve the previously documented stable DMG URL only after the
          # canonical updater transaction succeeds. A failure here can leave
          # the compatibility URL old, but can never make latest.json point at
          # bytes that are not present or fail its checksum.
          npx --yes wrangler@4.120.0 r2 object put \
            "${R2_BUCKET}/rapid-mac/rapid-mlx-desktop.dmg" \
            --file dist-dmg/rapid-mlx-desktop.dmg \
            --content-type application/x-apple-diskimage --remote

          # Cache-Control governs new responses; purge any object cached under
          # the pre-fix policy so this release becomes visible immediately.
          PURGE_PAYLOAD="$(jq -nc \
            --arg latest "${CDN_BASE}/latest.json" \
            --arg appcast "${CDN_BASE}/appcast.xml" \
            '{files: [$latest, $appcast]}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$PURGE_PAYLOAD" | jq -e '.success == true' >/dev/null
          echo "::notice::Published updater fallback version ${TARGET_VERSION}"

      - name: Create the GitHub Release (last — nothing ships before the pointer)
        # This used to be the "Attach to GitHub Release" step in ``build``,
        # which meant the release went public BEFORE mirror-dist ran. When the
        # fallback publication then failed, the release stayed up with a stale
        # latest.json behind it and only a red run to say so — three
        # consecutive times (#1851). Creating it here makes the release the
        # LAST thing that happens: if anything above fails, no release exists,
        # which is a state nobody has to notice for it to be safe.
        #
        # Escape hatch, if the fallback is broken and a release must go out
        # anyway: download the ``rapid-mlx-desktop-dmg`` artifact from this run
        # and create the release by hand. That is deliberately manual — an
        # automated bypass is the thing that let #1851 survive three releases.
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no ``actions/checkout`` (it only downloads artifacts),
          # so there is no ``.git`` for ``gh release`` to infer the repo from —
          # every ``gh release`` call died with "fatal: not a git repository"
          # once this step moved here from ``build`` (which does check out).
          # ``GH_REPO`` lets gh resolve the repo without a working tree.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          VERSION="${TAG#rapid-mac-v}"
          # Prerelease detection on the VERSION part only — the tag itself
          # always contains hyphens via the ``rapid-mac-v`` prefix, so we
          # must strip it before looking for a ``-rc`` style suffix.
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          NOTES_FILE="notes/release-notes.md"
          [[ -s "$NOTES_FILE" ]] || { echo "::error::missing $NOTES_FILE"; exit 1; }
          # The unsigned-build Gatekeeper preamble is already baked into these
          # bytes by the notes step in ``build``, so the release body and the
          # updater manifest carry identical text.
          if [[ "${SIGNED:-}" != "true" ]]; then
            PRERELEASE="--prerelease"
          fi
          # A re-run of an already-published tag must stay idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE" $PRERELEASE
            gh release upload "$TAG" dist-dmg/rapid-mlx-desktop.dmg --clobber
          else
            gh release create "$TAG" dist-dmg/rapid-mlx-desktop.dmg \
              --title "$TAG" --notes-file "$NOTES_FILE" $PRERELEASE
          fi
          echo "::notice::Published GitHub Release ${TAG}"
