name: Main guard

on:
  workflow_run:
    workflows: [CI, rapid-mac CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: main-guard-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

# CI_LINUX_LIGHT_RUNNER is a JSON runner spec (string or label array); unset uses ubuntu-latest.
# These jobs are seconds-long control-plane work; heavy test shards use CI_LINUX_RUNNER (ci.yml).
# Fork heads (pull_request, pull_request_target, workflow_run) always use ubuntu-latest.
# Rollback: gh variable delete CI_LINUX_LIGHT_RUNNER

jobs:
  guard:
    runs-on: ${{ fromJSON((vars.CI_LINUX_LIGHT_RUNNER != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository)) && vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Guard main and report nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: python -m scripts.main_guard --repo "$GITHUB_REPOSITORY"
