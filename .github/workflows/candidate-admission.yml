name: Candidate admission

on:
  workflow_run:
    workflows: [CI, Candidate qualification]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

# Deploy and validate this observer before making its context a queue condition.
# Candidate code/artifacts are never executed in this privileged workflow.
jobs:
  admit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Candidate qualification' ||
       (github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.event == 'pull_request' &&
        startsWith(github.event.workflow_run.head_branch, 'mergify/merge-queue/') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted admission consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate full candidate qualification
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER_NAME" = "CI" ]; then
            identity=(--source-run-id "$TRIGGER_RUN" --source-attempt "$TRIGGER_ATTEMPT")
          else
            identity=(--producer-run-id "$TRIGGER_RUN")
          fi
          python -m scripts.ci_candidate_admission \
            --repo "$GITHUB_REPOSITORY" --reuse-api-connection "${identity[@]}" \
            --github-output "$GITHUB_OUTPUT" \
            --output "$RUNNER_TEMP/candidate-admission.json"
      - name: Upload admission evidence
        if: steps.result.outputs.verified == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-admission-ci-${{ steps.result.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-admission.json
          if-no-files-found: error
          retention-days: 7
      - name: Index verified full admission
        if: steps.result.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.result.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=success -f context=candidate-admission/ci \
            -f description='Revalidated trusted full candidate; queue enrollment unchanged' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
