name: Candidate admission

on:
  workflow_run:
    workflows: [CI, Candidate qualification]
    types: [completed]
  workflow_dispatch:
    inputs:
      rollback:
        description: Disable candidate canary and revoke inflight reduced gates
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'candidate-rollout-control' || format('candidate-admission-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  statuses: write

# Deploy and validate this observer before making its context a queue condition.
# Candidate code/artifacts are never executed in this privileged workflow.
jobs:
  admit:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.name == 'Candidate qualification' ||
       (github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        startsWith(github.event.workflow_run.head_branch, 'mergify/merge-queue/') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted admission consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install existing rollout policy dependency
        run: python -m pip install "pyyaml>=6.0"
      - name: Revalidate full candidate qualification
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER_NAME" = "CI" ]; then
            identity=(--source-run-id "$TRIGGER_RUN" --source-attempt "$TRIGGER_ATTEMPT")
          else
            identity=(--producer-run-id "$TRIGGER_RUN")
          fi
          python -m scripts.ci_candidate_admission \
            --repo "$GITHUB_REPOSITORY" --reuse-api-connection "${identity[@]}" \
            --github-output "$GITHUB_OUTPUT" \
            --output "$RUNNER_TEMP/candidate-admission.json"
      - name: Upload admission evidence
        if: steps.result.outputs.verified == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-admission-ci-${{ steps.result.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-admission.json
          if-no-files-found: error
          retention-days: 7
      - name: Index verified full admission
        if: always() && steps.result.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.result.outputs.candidate_sha }}
          VERIFIED_PRODUCER: ${{ steps.result.outputs.producer_run_id }}
          NOTIFIED_PRODUCER: ${{ github.event.workflow_run.id }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          producer="$VERIFIED_PRODUCER"
          if [ -z "$producer" ]; then
            if [ "$TRIGGER_NAME" != "Candidate qualification" ]; then
              exit 0
            fi
            producer="$NOTIFIED_PRODUCER"
          fi
          python -m scripts.ci_candidate_admission \
            --repo "$GITHUB_REPOSITORY" \
            --producer-run-id "$producer" \
            --expected "$RUNNER_TEMP/candidate-admission.json" \
            --publish-target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/candidate-admission-publication.json"
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Check out trusted rollback controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Install existing rollout policy dependency
        run: python -m pip install "pyyaml>=6.0"
      - name: Disable rollout and revoke inflight gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.ci_candidate_admission --repo "$GITHUB_REPOSITORY" \
            --rollback --publish-target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/candidate-rollback.json"
      - name: Upload rollback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-rollback.json
          if-no-files-found: error
          retention-days: 7
  activate:
    if: github.event_name == 'workflow_dispatch' && !inputs.rollback && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record explicit rollout activation
        run: echo 'Trusted main activation; live consumers require this exact successful generation.'
