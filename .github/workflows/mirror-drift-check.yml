name: Mirror drift check

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      purge_gemma_index:
        description: Purge and verify the two fixed Gemma index URLs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mirror-drift-check
  cancel-in-progress: false

jobs:
  targeted-gemma-index-purge:
    name: Targeted Gemma index CDN purge (not a full mirror audit)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_gemma_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Purge and verify only the fixed Gemma index URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python scripts/purge_gemma_index_cdn.py

  audit-used-models:
    if: ${{ github.event_name == 'schedule' || !inputs.purge_gemma_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Install audit dependencies
        run: python -m pip install 'huggingface-hub>=1.1.0'
      - name: Audit shipped aliases against Hugging Face and the mirror
        shell: bash
        run: |
          set -o pipefail
          python scripts/mirror_drift_check.py --only-used --workers 32 2>&1 | tee mirror-drift.txt
      - name: Publish readable summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Mirror drift audit'
            echo '```text'
            cat mirror-drift.txt 2>/dev/null || echo 'Audit did not produce output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
