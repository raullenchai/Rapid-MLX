name: Mirror drift check

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-drift-check
  cancel-in-progress: false

jobs:
  audit-used-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Install audit dependencies
        run: python -m pip install 'huggingface-hub>=1.1.0'
      - name: Audit shipped aliases against Hugging Face and the mirror
        shell: bash
        run: |
          set -o pipefail
          python scripts/mirror_drift_check.py --only-used --workers 32 2>&1 | tee mirror-drift.txt
      - name: Publish readable summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Mirror drift audit'
            echo '```text'
            cat mirror-drift.txt 2>/dev/null || echo 'Audit did not produce output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image-pin-resolution:
    name: Pinned image revisions resolve upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - name: Install resolution dependencies
        run: python -m pip install 'huggingface-hub==1.33.0'
      - name: Fail separately on dangling image or runtime-asset pins
        run: python scripts/check_image_pins.py

  report-failure:
    needs: [audit-used-models, image-pin-resolution]
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduled failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_RESULT: ${{ needs.audit-used-models.result }}
          PIN_RESULT: ${{ needs.image-pin-resolution.result }}
        run: |
          set -euo pipefail
          title='Mirror drift check is failing'
          failed=()
          if [[ "$AUDIT_RESULT" == failure ]]; then failed+=(audit-used-models); fi
          if [[ "$PIN_RESULT" == failure ]]; then failed+=(image-pin-resolution); fi
          body=$(printf 'Run: %s\nFailed jobs: %s\nThe run summary lists the affected aliases.\n' "$RUN_URL" "${failed[*]}")
          issue=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq '[.[] | select(.title == "Mirror drift check is failing")][0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
